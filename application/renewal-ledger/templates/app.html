<div id="rl-app">
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>PROCURE360</h1>
      <p>Integrated Procurement &amp; Budget Management System</p>
    </div>
    <div class="actions">
      <button class="btn primary" id="btnAdd" type="button">+ Add software</button>
      <button class="btn" id="btnImport" type="button">Import Excel</button>
      <button class="btn" id="btnExport" type="button">Export</button>
      <button class="btn" id="btnGuide" type="button" data-act="guide">? Οδηγός</button>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Category">
    <button class="tab" role="tab" id="tabSw" type="button" data-act="gocat" data-cat="sw">Online Renewals<span class="cnt" id="cntSw"></span></button>
    <button class="tab" role="tab" id="tabCt" type="button" data-act="gocat" data-cat="ct">Συμβάσεις<span class="cnt" id="cntCt"></span></button>
    <button class="tab" role="tab" id="tabTn" type="button" data-act="gocat" data-cat="tn">Διαγωνισμοί<span class="cnt" id="cntTn"></span></button>
    <button class="tab" role="tab" id="tabBd" type="button" data-act="gocat" data-cat="bd">Προϋπολογισμός</button>
  </nav>
  <div class="alerts" id="alerts" aria-live="polite"></div>
  <section class="stats" id="stats"></section>
  <div class="tools">
    <input type="search" id="q" placeholder="Search name, vendor, website…" aria-label="Search">
    <div class="chips" id="chips" role="group" aria-label="Filter by status"></div>
  </div>
  <div class="list" id="list" aria-label="Software list"></div>
  <p class="hint" id="note" style="margin-top:12px"></p>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="fileXlsx" accept=".xlsx,.xls,.csv" hidden>
<input type="file" id="fileAttach" multiple hidden>
</div>
