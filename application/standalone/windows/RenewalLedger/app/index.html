<style>html,body{margin:0;background:#f0f2f6}#rl-app{min-height:100vh}</style>
<style>
#rl-app{
  --bg:#f0f2f6; --surface:#ffffff; --surface2:#f6f8fb; --ink:#14202e; --muted:#5b6878; --line:#d8dde6;
  --accent:#1e3a8a; --accent-ink:#ffffff; --accent-soft:#dde5f6;
  --ok:#1c7a4a; --ok-bg:#dff3e8; --warn:#8a5200; --warn-bg:#ffefcc; --bad:#b3261e; --bad-bg:#fde5e3;
  --shadow:0 12px 40px rgba(20,32,46,.18);
  --f-display:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-body:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Consolas,Menlo,monospace;
}
#rl-app *{box-sizing:border-box}
#rl-app{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
#rl-app h1,#rl-app h2,#rl-app h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
#rl-app button,#rl-app input,#rl-app select,#rl-app textarea{font:inherit;color:inherit}
#rl-app .wrap{max-width:none;margin:0 auto;padding-left:max(16px,1.2vw);padding-right:max(16px,1.2vw)}
#rl-app .top{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:space-between;padding-block:20px 16px}
#rl-app .brand h1{font-size:26px;font-weight:700}
#rl-app .brand p{margin:2px 0 0;color:var(--muted)}
#rl-app .brand .logo{display:block;height:72px;width:auto;max-width:100%}
#rl-app .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#rl-app .actions{display:flex;flex-wrap:wrap;gap:8px}
#rl-app .btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;min-height:38px}
#rl-app .btn:hover{border-color:var(--accent)}
#rl-app .btn:focus-visible,#rl-app input:focus-visible,#rl-app select:focus-visible,#rl-app textarea:focus-visible,#rl-app .row:focus-visible,#rl-app .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#rl-app .btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#rl-app .btn.danger{color:var(--bad)}
#rl-app .btn.small{padding:4px 10px;min-height:30px;font-size:13px}
#rl-app .btn[disabled]{opacity:.5;cursor:default}
#rl-app .alerts{display:grid;gap:8px;margin-bottom:16px}
#rl-app .alert{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:10px 14px;border-radius:8px;background:var(--warn-bg);color:var(--warn);font-weight:500}
#rl-app .alert.bad{background:var(--bad-bg);color:var(--bad)}
#rl-app .alert button{margin-left:auto;background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;padding:0}
#rl-app .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
#rl-app .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
#rl-app .stat b{display:block;font:700 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
#rl-app .stat span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
#rl-app .stat.bad b{color:var(--bad)}
#rl-app .stat.warn b{color:var(--warn)}
#rl-app .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
#rl-app .tools input[type=search]{flex:1 1 220px;min-width:0}
#rl-app input,#rl-app select,#rl-app textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:38px}
#rl-app textarea{resize:vertical;min-height:70px}
#rl-app .chips{display:flex;flex-wrap:wrap;gap:6px}
#rl-app .chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:13px}
#rl-app .chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#rl-app .list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
#rl-app .row,#rl-app .head{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.2fr) minmax(0,1.3fr) minmax(0,1fr) 120px;gap:12px;align-items:center;padding:12px 16px}
#rl-app .head{background:var(--surface2);color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
#rl-app .row{border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
#rl-app .row:last-child{border-bottom:0}
#rl-app .row:hover{background:var(--surface2)}
#rl-app .row .n{font-weight:600;overflow-wrap:anywhere}
#rl-app .row .sub{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
#rl-app .mono,#rl-app .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px}
#rl-app .pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
#rl-app .pill.ok{background:var(--ok-bg);color:var(--ok)}
#rl-app .pill.warn{background:var(--warn-bg);color:var(--warn)}
#rl-app .pill.bad{background:var(--bad-bg);color:var(--bad)}
#rl-app .pill.mute{background:rgba(127,127,127,.18);color:inherit}
#rl-app .stcard{border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 16px;background:var(--surface,transparent)}
#rl-app .stcard h3{margin:0 0 8px}
#rl-app .stgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
#rl-app .cfgrp{margin:12px 0;padding-top:8px;border-top:1px dashed var(--line)}
#rl-app .cfgrp h4{margin:0 0 6px}
#rl-app .cfrow{display:grid;grid-template-columns:2fr 1.4fr 2.4fr auto;gap:10px;align-items:end;margin:8px 0}
#rl-app .cfrow .cfopt[hidden]{display:none}
#rl-app .chk{display:inline-flex;gap:6px;align-items:center;margin:6px 14px 6px 0}
@media(max-width:720px){#rl-app .cfrow{grid-template-columns:1fr}}
#rl-app .guide h3{margin:22px 0 6px;font-size:1.05rem}
#rl-app .guide p,#rl-app .guide li{line-height:1.5;max-width:75ch}
#rl-app .guide ul{padding-left:20px;margin:6px 0}
#rl-app .gtoc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
#rl-app .amprev{display:block;margin-top:3px;font-size:12.5px;font-weight:600;color:#9a5b00}
#rl-app .amsum{background:var(--surface2,#f5f6f8);border-radius:10px;padding:10px 12px}
#rl-app .amh{border-left:3px solid #c98a1b;padding:4px 0 4px 10px;margin:8px 0}
#rl-app .amch{margin:4px 0 0 16px;padding:0;font-size:13px}
#rl-app .amold{text-decoration:line-through;color:var(--muted,#667)}
#rl-app .gsearch{width:100%;box-sizing:border-box;margin:8px 0 2px;padding:9px 12px;font:inherit;border:1px solid var(--line,#c9ced6);border-radius:8px;background:var(--surface,#fff);color:inherit}
#rl-app .empty{padding:40px 20px;text-align:center;color:var(--muted)}
#rl-app .empty h2{color:var(--ink);font-size:20px;margin-bottom:6px}
#rl-app .empty .actions{justify-content:center;margin-top:14px}
@media (max-width:760px){#rl-app .head{display:none}
#rl-app .lw{overflow:visible}
#rl-app .row{grid-template-columns:1fr !important;min-width:0 !important;gap:2px}
#rl-app .row .cell:not([data-first])::before{content:attr(data-l) ": ";color:var(--muted);font-size:12px}}
#rl-app .overlay{position:fixed;inset:0;background:rgba(10,16,24,.5);z-index:99990;display:flex;justify-content:flex-end}
#rl-app .panel{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;box-shadow:var(--shadow);padding:20px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:16px}
#rl-app .panel.wide{width:min(860px,100%)}
#rl-app .overlay[data-kind=wiz]{background:var(--surface);justify-content:center}
#rl-app .overlay[data-kind=wiz] .panel{width:100%;max-width:none;box-shadow:none;align-items:center;padding-top:24px}
#rl-app .overlay[data-kind=wiz] .panel>*{width:min(1040px,100%)}
#rl-app .overlay[data-kind=detail]{background:var(--surface);justify-content:center}
#rl-app .overlay[data-kind=detail] .panel{width:100%;max-width:none;box-shadow:none;align-items:center;padding-top:24px}
#rl-app .overlay[data-kind=detail] .panel>*{width:min(1040px,100%)}
#rl-app .overlay[data-kind=wiz] .panel>div[style*="display:grid"]{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
#rl-app .overlay[data-kind=wiz] .panel>div[style*="display:grid"] label.f:has(textarea){grid-column:1/-1}
#rl-app .overlay[data-kind=wiz] .panel>div[style*="display:grid"] label.f{align-content:start}
#rl-app .ph{display:flex;gap:12px;justify-content:space-between;align-items:flex-start}
#rl-app .ph h2{font-size:22px;overflow-wrap:anywhere}
#rl-app .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){#rl-app .grid2{grid-template-columns:1fr}}
#rl-app label.f{display:grid;gap:4px;font-weight:500;font-size:13px}
#rl-app label.f small{color:var(--muted);font-weight:400}
#rl-app .kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 12px;margin:0}
#rl-app .kv dt{color:var(--muted)}
#rl-app .kv dd{margin:0;overflow-wrap:anywhere}
#rl-app .sec{border-top:1px solid var(--line);padding-top:14px;display:grid;gap:10px}
#rl-app .sec h3{font-size:15px}
#rl-app .files{display:grid;gap:6px;margin:0;padding:0;list-style:none}
#rl-app .files li{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--surface2);border-radius:8px;padding:6px 10px}
#rl-app .files a{color:var(--accent);overflow-wrap:anywhere}
#rl-app .steps{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
#rl-app .steps i{display:block;height:100%;background:var(--accent);transition:width .2s}
#rl-app .big-q{font:700 22px/1.25 var(--f-display)}
#rl-app .hint{color:var(--muted);font-size:13px}
#rl-app .err{color:var(--bad);font-size:13px}
#rl-app .tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
#rl-app .tbl table{border-collapse:collapse;width:100%;font-size:13px}
#rl-app .tbl th,#rl-app .tbl td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
#rl-app .tbl th{background:var(--surface2);color:var(--muted)}
#rl-app .tbl tr.badrow td{background:var(--bad-bg)}
#rl-app .digest li{align-items:flex-start;gap:12px;flex-wrap:wrap;padding:10px 12px}
#rl-app .digest .actions{align-items:center}
#rl-app .tabs{display:flex;gap:10px;border-bottom:0;margin-bottom:18px;padding:6px 4px 12px;overflow-x:auto}
#rl-app .tab{--tc:#1e3a8a;--tc2:#2f4fa8;position:relative;display:inline-flex;align-items:center;background:linear-gradient(180deg,#ffffff,#eceff6);border:1px solid var(--line);border-bottom:4px solid var(--tc);border-radius:12px;margin:0;padding:10px 18px;font:600 15px var(--f-display);color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 rgba(15,23,42,.06),0 8px 14px -8px rgba(15,23,42,.35);transition:transform .12s,box-shadow .12s}
#rl-app #tabSw{--tc:#0b7d8f;--tc2:#0e8fa3}
#rl-app #tabCt{--tc:#1e3a8a;--tc2:#2f4fa8}
#rl-app #tabTn{--tc:#6d3fc0;--tc2:#7d52cf}
#rl-app #tabBd{--tc:#0f7a55;--tc2:#13906a}
#rl-app #tabPv{--tc:#b3541e;--tc2:#c9632a}
#rl-app #tabRc{--tc:#1d5fa8;--tc2:#2a73c2}
#rl-app .tab:hover{transform:translateY(-2px);box-shadow:0 4px 0 rgba(15,23,42,.06),0 12px 18px -8px rgba(15,23,42,.4)}
#rl-app .tab[aria-selected=true]{background:linear-gradient(180deg,var(--tc2),var(--tc));color:#fff;border-color:var(--tc);border-bottom-color:rgba(0,0,0,.35);transform:translateY(1px);box-shadow:inset 0 2px 3px rgba(255,255,255,.28),0 8px 16px -8px var(--tc)}
#rl-app .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#rl-app .tab .cnt{font:500 12px var(--f-mono);background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:0 7px;margin-left:8px;color:var(--muted)}
#rl-app .tab[aria-selected=true] .cnt{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.45);color:#fff}
#rl-app .tab .cnt:empty{display:none}
@media (prefers-reduced-motion:reduce){#rl-app .tab{transition:none}#rl-app .tab:hover{transform:none}}
#rl-app .kv.wl{grid-template-columns:200px minmax(0,1fr)}
@media (max-width:520px){#rl-app .kv.wl{grid-template-columns:1fr}
#rl-app .kv.wl dt{margin-top:6px}}
#rl-app .tbl td input,#rl-app .tbl td select{min-height:32px;padding:3px 6px;min-width:128px;width:auto}
#rl-app .tbl tr.cur td{background:var(--accent-soft)}
#rl-app .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:99995;max-width:90%}
@media (prefers-reduced-motion:reduce){#rl-app *{transition:none!important}}
#rl-app [hidden]{display:none!important}
#rl-app,#rl-app *{box-sizing:border-box}
#rl-app *{text-transform:none}
#rl-app button,#rl-app input,#rl-app select,#rl-app textarea{text-transform:none;letter-spacing:normal;box-shadow:none;margin:0;max-width:100%}
#rl-app input,#rl-app select,#rl-app textarea{height:auto}
#rl-app h1,#rl-app h2,#rl-app h3{color:var(--ink);padding:0;border:0}
#rl-app table{table-layout:auto;margin:0}
#rl-app a{text-decoration:underline}
#rl-app ul{list-style:none}

/* milestones */
#rl-app .msyear{display:grid;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
#rl-app .msyh{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#rl-app .files.ms li{align-items:flex-start;flex-wrap:wrap}
#rl-app .files.ms li.done .msb b{text-decoration:line-through;opacity:.7}
#rl-app .msb{display:grid;gap:3px;min-width:0;flex:1 1 220px}
#rl-app .msc{white-space:pre-wrap;overflow-wrap:anywhere}
#rl-app .msf{display:flex;gap:6px;flex-wrap:wrap}
#rl-app .msf a{color:var(--accent);overflow-wrap:anywhere}

/* sortable / selectable columns */
#rl-app .lw{overflow-x:auto}
#rl-app .head .hc{all:unset;cursor:pointer;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;overflow-wrap:anywhere;user-select:none}
#rl-app .head .hc:hover,#rl-app .head .hc:focus-visible{color:var(--ink)}
#rl-app .head .hc[aria-sort=ascending],#rl-app .head .hc[aria-sort=descending]{color:var(--accent);font-weight:700}
#rl-app .row .cell{min-width:0;overflow-wrap:anywhere}
#rl-app .colpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
#rl-app .colpick label{display:flex;gap:8px;align-items:center;background:var(--surface2);border-radius:8px;padding:8px 10px;cursor:pointer}

/* wide, dense table (many columns visible at once) */
#rl-app .list{border-radius:6px;background:var(--surface)}
#rl-app .lw{max-height:calc(100vh - 300px);min-height:200px;overflow:auto}
#rl-app .row,#rl-app .head{gap:0;padding:0;align-items:stretch;width:100%}
#rl-app .head{position:sticky;top:0;z-index:2;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:700;color:var(--ink);background:var(--surface2);border-bottom:1px solid var(--line)}
#rl-app .head .hc{display:block;padding:8px 10px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rl-app .head .hc:last-child{border-right:0}
#rl-app .row{font-size:12.5px}
#rl-app .row .cell{padding:6px 10px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:center;min-height:28px;line-height:28px;display:block}
#rl-app .row .cell:last-child{border-right:0}
#rl-app .row .n{font-weight:600}
#rl-app .row:nth-child(even){background:color-mix(in srgb,var(--surface2) 45%,transparent)}
#rl-app .row .pill{padding:1px 8px;font-size:11.5px}
/* breakout of the theme's content column (WordPress) */
#rl-app.rl-wide{width:calc(100vw - var(--rl-sbw,0px));position:relative;margin-left:calc(50% - (100vw - var(--rl-sbw,0px))/2);max-width:none}
@media (max-width:760px){#rl-app .row .cell{white-space:normal;line-height:1.4;border-right:0;min-height:0;padding:1px 10px}
#rl-app .lw{max-height:none}}
/* budget breakdown */
#rl-app .bpb{display:grid;gap:6px;margin-top:6px}
#rl-app .bp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#rl-app .bp input{width:130px}
#rl-app .bp select{min-width:200px;flex:1 1 220px;max-width:100%}
#rl-app .bp.ex input.exd{width:auto;flex:2 1 240px;min-width:160px}
#rl-app tr.bpr td{background:var(--surface2)}
#rl-app input[readonly]{background:var(--surface2);color:var(--muted)}

/* budget sheet */
#rl-app .bds{margin:0 0 22px}
#rl-app .bds h3{margin:0 0 4px;font-size:16px}
#rl-app .bdsel{display:inline-flex;gap:8px;align-items:center;font-weight:600}
#rl-app .bdsel select{min-width:260px;max-width:100%}
#rl-app table.bdt{width:100%}
#rl-app table.bdt th.num,#rl-app table.bdt td.num{text-align:right;white-space:nowrap}
#rl-app table.bdt td.how{white-space:normal;font-size:12px;color:var(--muted);min-width:280px}
#rl-app table.bdt tr.tot td{font-weight:700;background:var(--surface2)}
#rl-app #tabAr{--tc:#b45309;--tc2:#c2640f}
#rl-app #tabCo{--tc:#6d28d9;--tc2:#7c3aed}
#rl-app .ctrsel{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-weight:400}
#rl-app .ctrsel select{flex:1 1 260px;min-width:0;width:auto}
#rl-app dl.ctrinfo{margin:8px 0;padding:10px 12px;background:var(--surface2);border:1px dashed var(--line);border-radius:8px}
#rl-app #cCtrInfo{display:grid;gap:6px;font-weight:400}
#rl-app .overlay[data-kind=wiz] .panel>div[style*="display:grid"] label.f:has(.ctrsel){grid-column:1/-1}
#rl-app .stat span .yr{display:inline-block;font:800 1.45em/1.1 var(--f-display);letter-spacing:0;text-transform:none;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 8px;margin:0 3px}
#rl-app table.bdt th .yr{font-size:1.25em;font-weight:800}
#rl-app .bdleg{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
#rl-app .bdleg .lg{padding:3px 12px;border-radius:999px;font-size:12px;font-weight:600;border-left:5px solid var(--lc)}
#rl-app .bdleg .sw,#rl-app table.bdt tr.src-sw td{--lc:#0b7d8f;background:#dff1f4}
#rl-app .bdleg .ct,#rl-app table.bdt tr.src-ct td{--lc:#1e3a8a;background:#e1e7f6}
#rl-app .bdleg .tn,#rl-app table.bdt tr.src-tn td{--lc:#6d3fc0;background:#ece4f8}
#rl-app .bdleg .pv,#rl-app table.bdt tr.src-pv td{--lc:#b3541e;background:#fbe9dc}
#rl-app table.bdt tr.src-pv td:first-child{box-shadow:inset 5px 0 0 var(--lc)}
#rl-app table.rct td.bad{color:#b3261e;font-weight:700}
#rl-app table.bdt tr.src-sw td:first-child,#rl-app table.bdt tr.src-ct td:first-child,#rl-app table.bdt tr.src-tn td:first-child{box-shadow:inset 5px 0 0 var(--lc)}
#rl-app table.bdt td.how{color:inherit;opacity:.85}
#rl-app table.arview td.mono{white-space:nowrap}
#rl-app table.art input,#rl-app table.art select{width:100%;min-width:60px}
#rl-app table.art td:nth-child(2) input,#rl-app table.art td:nth-child(4) input{min-width:200px}
#rl-app .toast-undo,.toast-undo{margin-left:10px;background:transparent;border:1px solid currentColor;color:inherit;border-radius:6px;padding:3px 10px;font-weight:700;cursor:pointer}
#rl-app table.art td.trbtn{white-space:nowrap}
</style>
</head>

/* Local storage layer for the standalone (GitHub Pages) build.
   Provides the same small API the page uses: db, user, assets, downloads.
   Records and attachments live in this browser's IndexedDB. */
(function(){
  var cache={},subs=[],idb=null,ready=null;
  function openDb(){
    return new Promise(function(res,rej){
      if(!window.indexedDB)return rej(new Error("no indexedDB"));
      var r=indexedDB.open("renewal-ledger",1);
      r.onupgradeneeded=function(){var d=r.result;d.createObjectStore("docs");d.createObjectStore("blobs")};
      r.onsuccess=function(){res(r.result)};
      r.onerror=function(){rej(r.error)};
      r.onblocked=function(){rej(new Error("blocked"))};
    });
  }
  function init(){
    if(ready)return ready;
    ready=openDb().then(function(d){
      idb=d;
      return new Promise(function(res,rej){
        var t=d.transaction("docs","readonly"),c=t.objectStore("docs").openCursor();
        c.onsuccess=function(){var cur=c.result;if(cur){cache[cur.key]=cur.value;cur.continue()}};
        t.oncomplete=function(){res(true)};t.onerror=function(){rej(t.error)};
      });
    }).then(function(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}return true});
    return ready;
  }
  function put(store,key,val){return new Promise(function(res,rej){var t=idb.transaction(store,"readwrite");t.objectStore(store).put(val,key);t.oncomplete=function(){res()};t.onerror=t.onabort=function(){rej({code:"unavailable",message:String(t.error)})}})}
  function del(store,key){return new Promise(function(res,rej){var t=idb.transaction(store,"readwrite");t.objectStore(store).delete(key);t.oncomplete=function(){res()};t.onerror=t.onabort=function(){rej({code:"unavailable",message:String(t.error)})}})}
  function get(store,key){return new Promise(function(res,rej){var t=idb.transaction(store,"readonly"),r=t.objectStore(store).get(key);t.oncomplete=function(){res(r.result)};t.onerror=function(){rej(t.error)}})}
  function parent(path){return path.slice(0,path.lastIndexOf("/"))}
  function snapFor(path){
    var pre=path+"/",docs=Object.keys(cache).filter(function(k){return k.indexOf(pre)===0&&k.indexOf("/",pre.length)<0}).sort().map(function(k){var v=cache[k];return {id:k.slice(pre.length),exists:true,data:function(){return v}}});
    return {docs:docs,size:docs.length,empty:!docs.length};
  }
  function notify(path){subs.forEach(function(l){if(l.path===path){try{l.cb(snapFor(path))}catch(e){console.error(e)}}})}
  function docRef(path){
    return {
      set:function(d){var v=JSON.parse(JSON.stringify(d));return put("docs",path,v).then(function(){cache[path]=v;notify(parent(path))})},
      delete:function(){return del("docs",path).then(function(){delete cache[path];notify(parent(path))})},
      collection:function(n){return colRef(path+"/"+n)}
    };
  }
  function colRef(path){
    return {
      doc:function(id){return docRef(path+"/"+id)},
      onSnapshot:function(cb){var l={path:path,cb:cb};subs.push(l);setTimeout(function(){cb(snapFor(path))},0);return function(){subs=subs.filter(function(x){return x!==l})}}
    };
  }
  var db={doc:docRef,collection:colRef};
  function rid(){var a=new Uint8Array(16);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return ("0"+b.toString(16)).slice(-2)}).join("")}
  var assets={
    upload:function(blob,opts){
      if(!(blob instanceof Blob)||!blob.size)return Promise.reject({code:"invalid_request",message:"empty file"});
      if(blob.size>20*1048576)return Promise.reject({code:"too_large",message:"over 20 MiB"});
      var id=rid(),type=(opts&&opts.type)||blob.type||"application/octet-stream";
      return put("blobs",id,{blob:blob,type:type}).then(function(){return {id:id,url:"#",sizeBytes:blob.size,contentType:type}});
    },
    read:function(id){return init().then(function(){return get("blobs",id)}).then(function(r){return r&&r.blob||null})},
    delete:function(id){return del("blobs",id).then(function(){return {deleted:true}})}
  };
  var downloads={
    save:function(o){
      var type=/\.xlsx$/i.test(o.filename)?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":/\.csv$/i.test(o.filename)?"text/csv;charset=utf-8":"application/octet-stream";
      var blob=o.data instanceof Blob?o.data:new Blob([o.data],{type:type});
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=o.filename;document.body.appendChild(a);a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
      return Promise.resolve({status:"saved"});
    }
  };
  var user={id:function(){return Promise.resolve("local")}};
  window.claude={use:function(n){
    if(n==="db")return init().then(function(){return db},function(){return null});
    if(n==="assets")return init().then(function(){return assets},function(){return null});
    if(n==="downloads")return Promise.resolve(downloads);
    if(n==="user")return Promise.resolve(user);
    return Promise.resolve(null);
  }};
  /* open attachments (stored as blobs) in a new tab */
  function isHtmlFile(name,type){return /\.html?$/i.test(name||"")||/^text\/html/i.test(type||"")}
  function saveAs(b,name){var d=document.createElement("a");d.href=URL.createObjectURL(new Blob([b],{type:"application/octet-stream"}));d.download=name||"file.html";document.body.appendChild(d);d.click();setTimeout(function(){URL.revokeObjectURL(d.href);d.remove()},1500)}

    var a=e.target.closest&&e.target.closest("a[data-blob]");if(!a)return;
    e.preventDefault();
    /* every attachment is downloaded under its own file name (never opened in a tab, where it would get a generated name) */
    init().then(function(){return get("blobs",a.getAttribute("data-blob"))}).then(function(rec){
      if(!rec){alert("Το αρχείο δεν βρέθηκε / File not found");return}
      saveAs(rec.blob,a.textContent);
    });
  });
})();
</script>

/* search on the Settings page (v3.15.0): hides the cards (and custom-field groups) that do not contain the text; typed values count too */
function stFilter(){

  function txt(n){var t=n.textContent||"";[].forEach.call(n.querySelectorAll("input,select,textarea"),function(i){t+=" "+(i.value||"")});return t.toLowerCase()}
  [].forEach.call(root.querySelectorAll(".stcard"),function(c){
    var h=c.querySelector("h3"),hit=!q||txt(c).indexOf(q)>=0,groups=c.querySelectorAll(".cfgrp");
    if(q&&hit&&groups.length&&!(h&&h.textContent.toLowerCase().indexOf(q)>=0)){[].forEach.call(groups,function(g){g.style.display=txt(g).indexOf(q)>=0?"":"none"})}
    else[].forEach.call(groups,function(g){g.style.display=""});

  });

  if(q&&!shown){if(!m){m=document.createElement("p");m.id="stNone";m.className="hint";root.appendChild(m)}m.textContent="Δεν βρέθηκε τίποτα στις ρυθμίσεις για «"+S.q+"»."}else if(m)m.remove();

/* Deleting never destroys: the record goes to the trash (WordPress: on the server; here: kept with a deletedAt mark) and can be restored. */
var TRASH_DAYS=30;
function trashDays(){return window.RL_TRASH?(window.RL_TRASH.days||0):TRASH_DAYS}
function collName(cat){return (CATS[cat]||CATS.sw).c}

async function remove(id,cat){

  else if(S.db&&S.uid){var rec=strip(it);rec.deletedAt=Date.now();try{await col(collName(cat)).doc(id).set(rec)}catch(e){toast("Could not delete");return false}}

function trashFromDocs(cat,docs){S.trash[cat]=docs.map(function(d){return Object.assign({id:d.id},d.data(),{_at:d.data().deletedAt||0})})}

async function restoreItem(cat,id){
  var it=(S.trash[cat]||[]).find(function(x){return x.id===id});if(!it)return false;
  if(cat==="co"){var dq=coDup(it.name,"",id);if(dq){toast("Δεν επαναφέρθηκε: υπάρχει ήδη ανάδοχος με το ίδιο όνομα («"+dq.name+"»)");return false}}

  if(cat==="ct"){var dc=ctDup(it.tender,id);if(dc){toast("Δεν επαναφέρθηκε: υπάρχει ήδη Σύμβαση με τον ίδιο αριθμό διαγωνισμού «"+it.tender+"» («"+dc.title+"»)");return false}}
  if(window.RL_TRASH){try{await window.RL_TRASH.restore(collName(cat),id)}catch(e){toast("Could not restore");return false}await loadTrash(cat);return true}
  var rec=strip(it);delete rec.deletedAt;delete rec._at;delete rec._by;

async function purgeItem(cat,id){
  var it=(S.trash[cat]||[]).find(function(x){return x.id===id});if(!it)return false;
  if(window.RL_TRASH){try{await window.RL_TRASH.purge(collName(cat),id)}catch(e){toast("Could not delete");return false}await loadTrash(cat);return true}
  var files=(it.attachments||[]).concat((it.milestones||[]).reduce(function(a,m){return a.concat(m.attachments||[])},[]));
  if(S.db&&S.uid){try{await col(collName(cat)).doc(id).delete()}catch(e){toast("Could not delete");return false}}
  else{S.trash[cat]=S.trash[cat].filter(function(x){return x.id!==id});render()}
  if(S.assets)for(var i=0;i<files.length;i++){if(fileInUse(files[i].id,cat,id))continue;try{await S.assets.delete(files[i].id)}catch(_){}}
  return true;
}
/* browser versions: remove records that have been in the trash longer than TRASH_DAYS */
async function autoPurge(){
  if(window.RL_TRASH||!TRASH_DAYS)return;
  var lim=Date.now()-TRASH_DAYS*864e5;
  ["sw","ct","tn","co","pv"].forEach(function(c){(S.trash[c]||[]).filter(function(x){return x._at&&x._at<lim}).forEach(function(x){purgeItem(c,x.id)})});
}
/* a file may be referenced by two records (a promoted tender and its contract in the browser builds): only delete it when nothing else uses it */
function fileInUse(fid,xcat,xid){

  chk("sw",S.items);chk("ct",S.contracts);chk("tn",S.tenders);chk("pv",S.provisions);["sw","ct","tn","pv"].forEach(function(c){chk(c,S.trash[c])});
  return hit;
}

function startWizard(id){

function collect(){
  var w=S.wiz;
  swF().forEach(function(f){var el=$("#w_"+f.k);if(el)w.data[f.k]=el.value});
  var r=$("#w_remind");if(r)w.data.remindDays=+r.value;

function validate(keys){
  var d=S.wiz.data;
  for(var i=0;i<keys.length;i++){
    var f=swF().filter(function(x){return x.k===keys[i]})[0];if(!f)continue;
    var v=d[f.k];
    if(f.cf){var ce=cfErr(f,v);if(ce)return ce}
    if(f.req&&(v==null||String(v).trim()===""))return f.l+" is required.";
    if(f.date&&v&&!parseIso(v))return f.l+" is not a valid date.";
    if(f.email&&v&&emailsErr(v))return emailsErr(v);
    if(f.num&&v!==""&&v!=null&&(!isFinite(Number(v))||Number(v)<0))return "Enter the cost as a number, for example 120.50.";
  }
  if(keys.indexOf("dateTo")>=0&&d.dateFrom&&d.dateTo&&d.dateTo<d.dateFrom)return "Date To must be on or after Date From.";
  if(keys.indexOf("cost")>=0||keys.length>3){var be=bpErr(d,0);if(be)return be}
  return "";
}
function bpSec(d){return '<div class="sec"><h3>Cost breakdown (optional)</h3><p class="hint">Split the cost into partial amounts per year, each with its budget article. When you add partial amounts, the cost is their sum.</p>'+bpBlock(d,null,0,msYears("sw",d))+'</div>'}

async function doRenew(id){
  var it=byId(id),f=$("#r_from").value,t=$("#r_to").value,c=$("#r_cost").value,err="";

/* ---------- attachments ---------- */
/* Largest attachment: 20 MB, or less when the WordPress server (PHP upload_max_filesize / post_max_size) allows less. */
function attMax(){var m=window.RL_CFG&&Number(window.RL_CFG.maxUpload);return m>0?Math.min(m,20971520):20971520}
function attMB(){var v=attMax()/1048576;return v>=10?String(Math.round(v)):String(Math.round(v*10)/10).replace(".",",")}
function attTooBig(f,el){
  if(f.size<=attMax())return "";
  var sz=(f.size/1048576).toFixed(1).replace(".",",");
  return el?"το αρχείο είναι "+sz+" MB και το όριο είναι "+attMB()+" MB"+(window.RL_CFG&&attMax()<20971520?" (όριο του server: ζήτα από τον διαχειριστή του hosting να αυξήσει τα upload_max_filesize και post_max_size σε τουλάχιστον 20M)":""):"file is "+sz+" MB, the limit is "+attMB()+" MB";
}
var MIME={html:"text/html",htm:"text/html",pdf:"application/pdf",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",webp:"image/webp",csv:"text/csv",txt:"text/plain",md:"text/markdown",json:"application/json",xml:"application/xml",eml:"message/rfc822",msg:"application/vnd.ms-outlook",lic:"application/octet-stream",rtf:"application/rtf",log:"text/plain",ics:"text/calendar",vcf:"text/vcard",zip:"application/zip","7z":"application/x-7z-compressed",rar:"application/vnd.rar",gz:"application/gzip",tar:"application/x-tar",p7m:"application/pkcs7-mime",p7s:"application/pkcs7-signature",cer:"application/pkix-cert",crt:"application/x-x509-ca-cert",tif:"image/tiff",tiff:"image/tiff",bmp:"image/bmp",dwg:"application/octet-stream",dxf:"application/octet-stream",mp4:"video/mp4",webm:"video/webm"};
function reopen(cat,id){cat==="pv"?showPvDetail(id):cat==="co"?showCoDetail(id):cat==="tn"?showTnDetail(id):cat==="ct"?showCtDetail(id):showDetail(id)}
async function attachFiles(files){
  var cat=S.openCat||"sw",id=S.open,it=getItem(cat,id);if(!it||!S.assets)return;
  var list=(it.attachments||[]).slice(),n=0,el=cat!=="sw";
  for(var i=0;i<files.length;i++){
    var f=files[i],ext=(f.name.split(".").pop()||"").toLowerCase(),type=f.type&&MIME[ext]===f.type?f.type:MIME[ext]||f.type;
    var big=attTooBig(f,el);if(big){toast(f.name+": "+big);continue}
    try{var r=await S.assets.upload(f,type?{type:type}:undefined);list.push({id:r.id,name:f.name,size:r.sizeBytes});n++}
    catch(e){toast(f.name+": "+(e&&e.code==="unsupported_type"?(el?"μη υποστηριζόμενος τύπος (PDF, εικόνα, CSV, κείμενο, Word, Excel, PowerPoint, HTML, XML, email (eml/msg), άδεια (lic), zip/7z/rar κ.ά.)":"file type not supported (use PDF, image, CSV, text, Word, Excel, PowerPoint, HTML, XML, email (eml/msg), license (lic), zip/7z/rar and similar)"):e&&(e.code==="bad_content"||e.code==="infected")?(el?(e.code==="infected"?"το αρχείο απορρίφθηκε από τον έλεγχο ιών":"το περιεχόμενο δεν ταιριάζει με τον τύπο του αρχείου, ή είναι πρόγραμμα"):(e.code==="infected"?"refused by the antivirus check":"content does not match the file type, or it is a program")):e&&e.code==="av_unavailable"?(el?"ο έλεγχος ιών δεν ολοκληρώθηκε· το αρχείο δεν αποθηκεύτηκε":"antivirus check could not be completed; file not stored"):e&&e.code==="too_large"?(el?"μεγαλύτερο από το όριο ("+attMB()+" MB)":"larger than the limit ("+attMB()+" MB)"):(el?"αποτυχία μεταφόρτωσης":"upload failed")))}
  }
  if(n){var rec=strip(it);rec.attachments=list;if(await save(id,rec,cat)){toast(el?n+" αρχείο/α προστέθηκαν":n+" file"+(n>1?"s":"")+" attached");reopen(cat,id)}}
}
async function removeFile(i){
  var cat=S.openCat||"sw",it=getItem(cat,S.open);if(!it)return;var a=(it.attachments||[])[i];if(!a)return;
  var rec=strip(it);rec.attachments=it.attachments.filter(function(_,j){return j!==i});
  var before=(it.attachments||[]).slice(),id=it.id,el=cat!=="sw";
  if(await save(id,rec,cat)){
    reopen(cat,id);
    /* the file itself is only deleted when the 8 s to undo are over */
    toastUndo(el?"Το αρχείο αφαιρέθηκε":"File removed",async function(){
      var cur=getItem(cat,id);if(!cur)return;var r2=strip(cur);r2.attachments=before;
      if(await save(id,r2,cat)&&S.open===id)reopen(cat,id);
    },function(){if(fileInUse(a.id))return;try{S.assets.delete(a.id)}catch(e){}},el);
  }
}

/* =============== MILESTONES (both categories) =============== */
var REMIND_MS=[30,60];
function msIsEl(cat){return cat==="ct"}
function msList(it){return (it&&it.milestones)||[]}
/* Number of "years" of a record: contracts use their year table; software counts whole years from Date From to Date To. */
function msYears(cat,it){
  if(cat==="ct")return Math.max(1,(it.years||[]).length);
  var a=parseIso(it.dateFrom),b=parseIso(it.dateTo);if(!a||!b||b<a)return 1;
  var n=1;while(n<60&&addDays(addMonths(it.dateFrom,12*n),-1)<it.dateTo)n++;
  return n;
}
function msYearRange(cat,it,y){
  if(cat==="ct"){var r=(it.years||[])[y-1];return r?fmtDate(r.from)+" – "+fmtDate(r.to):""}
  var f=addMonths(it.dateFrom,12*(y-1));if(!parseIso(f))return "";
  var t=addDays(addMonths(it.dateFrom,12*y),-1);if(it.dateTo&&t>it.dateTo)t=it.dateTo;
  return fmtDate(f)+" – "+fmtDate(t);
}
function msInfo(m){
  var el=!!m._el,d=daysLeft(m.due);
  if(m.done)return {k:"ok",t:el?"Ολοκληρώθηκε":"Done",d:d};
  if(d==null)return {k:"ok",t:el?"Χωρίς ημερομηνία":"No date",d:null};
  if(d<0)return {k:"bad",t:el?"Εκπρόθεσμο":"Overdue",d:d};
  if(d<=(+m.remind||30))return {k:"warn",t:el?"Πλησιάζει":"Due soon",d:d};
  return {k:"ok",t:el?"Προγραμματισμένο":"Scheduled",d:d};
}
function msAll(cat){
  var out=[];
  listOf(cat).forEach(function(it){if(cat==="ct"&&ctInfo(it).archived)return;msList(it).forEach(function(m){
    var s=msInfo(Object.assign({_el:cat==="ct"},m));
    if(s.k!=="ok")out.push({cat:cat,it:it,m:m,s:s});
  })});
  out.sort(function(a,b){return a.s.d-b.s.d});
  return out;
}
function msAttn(cat){return msAll(cat).length}
function msTitle(cat,it){return cat==="ct"?it.title:it.name}
function msAlertHtml(cat){
  var l=msAll(cat);if(!l.length)return "";

async function msUpload(files){
  var w=S.ms;if(!w||!S.assets)return;msCollect();var el=w.cat==="ct";
  for(var i=0;i<files.length;i++){
    var f=files[i],ext=(f.name.split(".").pop()||"").toLowerCase(),type=f.type&&MIME[ext]===f.type?f.type:MIME[ext]||f.type;
    var big=attTooBig(f,el);if(big){toast(f.name+": "+big);continue}
    try{var r=await S.assets.upload(f,type?{type:type}:undefined);w.d.attachments.push({id:r.id,name:f.name,size:r.sizeBytes});w.added.push(r.id)}
    catch(e){toast(f.name+": "+(e&&e.code==="unsupported_type"?(el?"μη υποστηριζόμενος τύπος":"file type not supported"):e&&(e.code==="bad_content"||e.code==="infected")?(el?(e.code==="infected"?"το αρχείο απορρίφθηκε από τον έλεγχο ιών":"το περιεχόμενο δεν ταιριάζει με τον τύπο του αρχείου, ή είναι πρόγραμμα"):(e.code==="infected"?"refused by the antivirus check":"content does not match the file type, or it is a program")):e&&e.code==="av_unavailable"?(el?"ο έλεγχος ιών δεν ολοκληρώθηκε· το αρχείο δεν αποθηκεύτηκε":"antivirus check could not be completed; file not stored"):e&&e.code==="too_large"?(el?"μεγαλύτερο από το όριο ("+attMB()+" MB)":"larger than the limit ("+attMB()+" MB)"):(el?"αποτυχία μεταφόρτωσης":"upload failed")))}
  }
  msDraw();
}
async function msSave(){
  var w=S.ms;msCollect();var d=w.d,el=w.cat==="ct",it=getItem(w.cat,w.id);if(!it)return;
  var e="";
  if(!String(d.description).trim())e=el?"Συμπλήρωσε την περιγραφή.":"Enter a description.";
  else if(!parseIso(d.due))e=el?"Επίλεξε ημερομηνία παράδοσης.":"Choose a delivery date.";
  if(e){w.err=e;var x=$("#mserr");if(x)x.textContent=e;return}
  var obj={id:w.mid||uid(),year:w.year,description:String(d.description).trim(),due:d.due,remind:d.remind===60?60:30,comments:String(d.comments||"").trim(),done:!!d.done,attachments:d.attachments||[]};
  var list=msList(it).slice(),i=list.findIndex(function(x){return x.id===obj.id});
  if(i>=0)list[i]=obj;else list.push(obj);
  var rec=strip(it);rec.milestones=list;
  if(await save(w.id,rec,w.cat)){
    var gone=(w.removed||[]).slice();
    for(var k=0;k<gone.length;k++){try{await S.assets.delete(gone[k])}catch(_){}}
    S.ms=null;toast(el?"Το milestone αποθηκεύτηκε":"Milestone saved");reopen(w.cat,w.id);
  }
}
async function msCancel(){
  var w=S.ms;if(!w)return;
  var add=(w.added||[]).slice();S.ms=null;
  for(var k=0;k<add.length;k++){try{await S.assets.delete(add[k])}catch(_){}}
  reopen(w.cat,w.id);
}
async function msToggleDone(mid){
  var cat=S.openCat||"sw",it=getItem(cat,S.open);if(!it)return;
  var list=msList(it).map(function(m){return m.id===mid?Object.assign({},m,{done:!m.done}):m});
  var rec=strip(it);rec.milestones=list;
  if(await save(it.id,rec,cat))reopen(cat,it.id);
}
async function msDelete(mid){
  var cat=S.openCat||"sw",it=getItem(cat,S.open);if(!it)return;
  var m=msList(it).find(function(x){return x.id===mid});if(!m)return;
  var before=msList(it).slice(),id=it.id,el=cat==="ct",rec=strip(it);rec.milestones=before.filter(function(x){return x.id!==mid});
  if(await save(id,rec,cat)){
    reopen(cat,id);
    /* the milestone's files are only deleted when the 8 s to undo are over */
    toastUndo(el?"Το milestone διαγράφηκε":"Milestone deleted",async function(){
      var cur=getItem(cat,id);if(!cur)return;var r2=strip(cur);r2.milestones=before;
      if(await save(id,r2,cat)&&S.open===id)reopen(cat,id);
    },async function(){var f=(m.attachments||[]);for(var k=0;k<f.length;k++){try{await S.assets.delete(f[k].id)}catch(_){}}},el);
  }
}

  try{p=JSON.parse(localStorage.getItem("rl.listprefs")||"null")}catch(e){}

    var keys=colsAll(c).map(function(x){return x.k}),sel=p&&p.cols&&Array.isArray(p.cols[c])?p.cols[c].filter(function(k){return keys.indexOf(k)>=0}):null;

function parseArtLines(text){
  var out=[],seen={};
  String(text||"").split(/\r?\n/).forEach(function(line){
    var p=line.split(/\t|\|/).map(function(x){return x.trim()}),code=(p[0]||"").slice(0,40);
    if(!code||seen[code])return;seen[code]=1;
    out.push({code:code,desc:(p[1]||"").slice(0,200),cat:(p[2]||"").slice(0,40),catDesc:(p[3]||"").slice(0,200),split:/^(Ν|N|YES|Y)/i.test((p[4]||"").trim())});
  });
  return out.slice(0,500);
}
function artLines(list){return list.map(function(a){return [a.code,a.desc,a.cat,a.catDesc,a.split?"ΝΑΙ":"ΌΧΙ"].join(" | ")}).join("\n")}
function articles(){

  else{try{a=JSON.parse(localStorage.getItem("rl.articles")||"null")}catch(e){}}

}
/* find an article by its code (also accepts "code description" text) */
function artFind(v,list){
  v=String(v||"").trim();if(!v)return null;list=list||articles();
  for(var i=0;i<list.length;i++)if(list[i].code===v)return list[i];
  var t=v.split(/\s/)[0];
  for(var j=0;j<list.length;j++)if(list[j].code===t)return list[j];
  return null;
}
function artLabel(v){var a=artFind(v);return a?(a.code+" — "+a.desc):String(v||"")}
function artOpts(v,el){
  var l=articles(),cur=artFind(v,l),val=cur?cur.code:String(v||""),groups=[],map={};
  l.forEach(function(a){var k=a.cat+"|"+a.catDesc;if(!map[k]){map[k]={t:(a.cat+(a.catDesc?" · "+a.catDesc:"")).trim(),l:[]};groups.push(map[k])}map[k].l.push(a)});
  var opt=function(a){return '<option value="'+esc(a.code)+'"'+(a.code===val?' selected':'')+'>'+esc(a.code+" — "+a.desc)+'</option>'};
  var h='<option value="">'+(el?"— Άρθρο προϋπολογισμού —":"— Budget article —")+'</option>'+groups.map(function(g){return '<optgroup label="'+esc(g.t)+'">'+g.l.map(opt).join("")+'</optgroup>'}).join("");
  if(val&&!cur)h+='<option value="'+esc(val)+'" selected>'+esc(val)+'</option>';
  return h;
}
function bpHas(d,year){return (d.budget||[]).some(function(p){return year==null||+p.year===year})}
function bpSum(list,year){return r2((list||[]).filter(function(p){return year==null||+p.year===year}).reduce(function(a,p){return a+(Number(p.amount)||0)},0))}
function bpCollect(d){(d.budget||[]).forEach(function(p,i){var a=$("#bp_amt_"+i),r=$("#bp_art_"+i),y=$("#bp_yr_"+i);if(a)p.amount=a.value;if(r)p.article=r.value;if(y)p.year=+y.value||1})}
function bpClean(d){return (d.budget||[]).filter(function(p){return p.amount!==""&&p.amount!=null&&isFinite(Number(p.amount))}).map(function(p){return {year:Math.max(1,+p.year||1),amount:r2(p.amount),article:String(p.article||"")}})}
function bpErr(d,el){
  for(var i=0;i<(d.budget||[]).length;i++){var p=d.budget[i];
    if(p.amount===""||p.amount==null){if(p.article)return el?"Συμπλήρωσε το ποσό σε κάθε επιμέρους γραμμή.":"Enter an amount on every partial amount line.";continue}
    if(!isFinite(Number(p.amount))||Number(p.amount)<0)return el?"Τα επιμέρους ποσά πρέπει να είναι αριθμοί, π.χ. 500.50.":"Partial amounts must be numbers, for example 500.50."}
  return "";
}

/* how many records (live and trashed) use an article code */
function artUsage(code){

  S.items.forEach(fn);S.contracts.forEach(fn);S.tenders.forEach(fn);S.trash.sw.forEach(fn);S.trash.ct.forEach(fn);S.trash.tn.forEach(fn);

function saveArticles(){
  var list=[],seen={};
  [].forEach.call(document.querySelectorAll("#artRows tr"),function(tr){
    var o={};[].forEach.call(tr.querySelectorAll("[data-k]"),function(n){o[n.dataset.k]=n.value.replace(/[|\t\r\n]/g," ").trim()});
    if(!o.code||seen[o.code])return;seen[o.code]=1;
    list.push({code:o.code.slice(0,40),desc:(o.desc||"").slice(0,200),cat:(o.cat||"").slice(0,40),catDesc:(o.catDesc||"").slice(0,200),split:o.split==="1"});
  });
  var kept=[];
  articles().forEach(function(a){if(!seen[a.code]&&artUsage(a.code)){list.push(a);kept.push(a.code)}});
  list=list.slice(0,500);
  function done(){
    closePanel();toast(kept.length?(S.cat!=="sw"?"Αποθηκεύτηκαν. Διατηρήθηκαν επειδή χρησιμοποιούνται: ":"Saved. Kept because they are in use: ")+kept.join(", "):S.cat!=="sw"?"Τα άρθρα αποθηκεύτηκαν":"Articles saved");
    if(S.cat==="bd"||S.cat==="ar")render();else{var ca=$("#cntAr");if(ca)ca.textContent=articles().length||""}
  }
  if(window.RL_SAVE_ARTICLES){
    /* WordPress: the server stores the list (and keeps articles that records still use) */
    window.RL_SAVE_ARTICLES(list).then(function(res){
      window.RL_CFG.articles=res.articles;kept=res.kept||[];done();
    },function(e){toast(e&&e.status===403?"Δεν έχεις δικαίωμα επεξεργασίας άρθρων":"Αποτυχία αποθήκευσης άρθρων: "+((e&&e.message)||""))});
    return;
  }
  try{localStorage.setItem("rl.articles",JSON.stringify(list))}catch(e){}
  done();
}

/* =============== BUDGET SHEET (Προϋπολογισμός) =============== */
/*BD-CALC-START*/
function bdParts(s){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?{y:+m[1],m:+m[2],d:+m[3]}:null}
function bdGr(s){var p=bdParts(s);return p?(p.d<10?"0":"")+p.d+"/"+(p.m<10?"0":"")+p.m+"/"+p.y:"—"}
function bdEur(n){var v=r2(n),s=Math.abs(v).toFixed(2).split(".");return (v<0?"-":"")+s[0].replace(/\B(?=(\d{3})+(?!\d))/g,".")+","+s[1]+" €"}
function bdNum(n){return bdEur(n).replace(" €","")}
function bdMo(x){return String(Math.round(x*100)/100).replace(".",",")}
/* months of the period that fall in each calendar year; a part-month counts by the share of its days */
function bdMonths(f,t){
  var a=bdParts(f),b=bdParts(t);if(!a||!b||t<f)return null;
  var by={},tot=0,y=a.y,m=a.m;
  while(y<b.y||(y===b.y&&m<=b.m)){
    var dim=new Date(Date.UTC(y,m,0)).getUTCDate(),s=(y===a.y&&m===a.m)?a.d:1,e=(y===b.y&&m===b.m)?b.d:dim,fr=(e-s+1)/dim;
    by[y]=(by[y]||0)+fr;tot+=fr;m++;if(m>12){m=1;y++}
  }
  return {by:by,total:tot};
}
/* split=true (ΝΑΙ): spread by month over the calendar years of the period; otherwise the whole amount goes to the start year */
function bdAlloc(amount,from,to,split){
  var f=bdParts(from);if(!f)return null;
  var by={},txt,note="";
  if(split){
    var mo=bdMonths(from,to);
    if(mo){
      var ys=Object.keys(mo.by).map(Number).sort(function(a,b){return a-b});
      if(ys.length===1){by[ys[0]]=r2(amount);txt="όλο το διάστημα εντός του "+ys[0]}
      else{
        var acc=0,parts=[];
        ys.forEach(function(y,i){
          var v=i===ys.length-1?r2(amount-acc):r2(amount*mo.by[y]/mo.total);acc=r2(acc+v);by[y]=v;
          parts.push(y+": "+bdMo(mo.by[y])+"/"+bdMo(mo.total)+" μήνες = "+bdEur(v));
        });
        txt="κατανομή ανά μήνα ("+parts.join(", ")+")";
      }
      return {by:by,text:txt};
    }
    note=" (χωρίς έγκυρη ημερομηνία λήξης)";
  }
  by[f.y]=r2(amount);
  return {by:by,text:"ολόκληρο το ποσό στο έτος έναρξης "+f.y+note};
}
/* rows: one per record and article; amounts per calendar year */
var BD_VAT=0.19; /* amounts in the records are net of VAT; the budget sheet shows them including 19% VAT */
function bdBuild(arts,items,contracts,tenders,vat,provs){
  vat=vat==null?bdVat():vat;
  var rows={},order=[],warn=[];
  function rowFor(code,kind,id,desc,head){var k=code+"|"+kind+"|"+id;if(!rows[k]){rows[k]={code:code,kind:kind,id:id,desc:desc,how:head.slice(),by:{}};order.push(k)}return rows[k]}
  function seg(kind,id,desc,head,label,from,to,parts,cost,force){
    var list=(parts||[]).filter(function(p){var n=Number(p.amount);return p.amount!==""&&p.amount!=null&&isFinite(n)&&n!==0});
    if(!list.length&&Number(cost)>0)list=[{amount:Number(cost),article:""}];
    var groups={},gorder=[];
    list.forEach(function(p){
      var a=artFind(p.article,arts),code=a?a.code:"",g=groups[code];
      if(!g){g=groups[code]={a:a,sum:0,amts:[],raw:""};gorder.push(code)}
      g.sum=r2(g.sum+Number(p.amount));g.amts.push(Number(p.amount));
      if(!a&&p.article)g.raw=String(p.article);
    });
    gorder.forEach(function(code){
      var g=groups[code],gross=r2(g.sum*(1+vat)),al=bdAlloc(gross,from,to,!!(force||(g.a&&g.a.split)));
      if(!al){warn.push(desc+" ("+label+"): δεν έχει έγκυρη ημερομηνία έναρξης, το ποσό "+bdEur(g.sum)+" δεν περιλαμβάνεται.");return}
      var r=rowFor(code,kind,id,desc,head);
      Object.keys(al.by).forEach(function(y){r.by[y]=r2((r.by[y]||0)+al.by[y])});
      r.how.push(label+" ("+bdGr(from)+" – "+bdGr(to)+"): "+bdEur(g.sum)+(g.amts.length>1?" = "+g.amts.map(bdNum).join(" + "):"")+(vat?" + ΦΠΑ "+(Math.round(vat*10000)/100)+"% ("+bdEur(r2(gross-g.sum))+") = "+bdEur(gross):"")+" — "+al.text+(g.raw?" · το άρθρο «"+g.raw+"» δεν υπάρχει στη λίστα άρθρων":(code===""?" · χωρίς άρθρο":"")));
    });
  }
  (items||[]).forEach(function(it){
    seg("sw",it.id,it.name||"",["Ανανέωση: "+bdGr(it.dateFrom)+" – "+bdGr(it.dateTo)],"Ποσό",it.dateFrom,it.dateTo,it.budget,it.cost);
  });
  (contracts||[]).forEach(function(c){
    var head=["Διαγωνισμός: "+(c.tender||"—")+" · Διάρκεια: "+(c.months!==""&&c.months!=null?c.months:"—")+" μήνες","Σύμβαση: "+bdGr(c.dateFrom)+" – "+bdGr(c.dateTo)];
    (c.years||[]).forEach(function(y,i){
      seg("ct",c.id,c.title||"",head,"Έτος "+(i+1),y.from,y.to,(c.budget||[]).filter(function(p){return +p.year===i+1}),y.cost);
    });
  });
  /* additional / optional services: the yearly amount of every contract year, spread by month over that year (always monthly) */
  (contracts||[]).forEach(function(c){
    var head=["Διαγωνισμός: "+(c.tender||"—")+" · Διάρκεια: "+(c.months!==""&&c.months!=null?c.months:"—")+" μήνες","Σύμβαση: "+bdGr(c.dateFrom)+" – "+bdGr(c.dateTo)];
    (c.extras||[]).forEach(function(e){
      if(!exOk(e))return;
      (c.years||[]).forEach(function(y,i){
        seg("ct",c.id,c.title||"",head,"Έτος "+(i+1)+" · υπηρεσία «"+(e.desc||"")+"»",y.from,y.to,[{amount:Number(e.amount),article:e.article}],0,true);
      });
    });
  });
  (tenders||[]).forEach(function(c){
    var head=["Εκτιμώμενος διαγωνισμός: "+(c.tender||"—")+" · Διάρκεια: "+(c.months!==""&&c.months!=null?c.months:"—")+" μήνες","Εκτιμώμενη περίοδος: "+bdGr(c.dateFrom)+" – "+bdGr(c.dateTo)];
    (c.years||[]).forEach(function(y,i){
      seg("tn",c.id,c.title||"",head,"Έτος "+(i+1),y.from,y.to,(c.budget||[]).filter(function(p){return +p.year===i+1}),y.cost);
    });
  });
  /* general provisions (3.16.0): the amount of each of the 3 years goes whole into that calendar year, at the article of the provision */
  (provs||[]).forEach(function(p){
    var b=+p.baseYear||0;
    (p.amounts||[]).forEach(function(a){
      var y=+a.year;if(!y||y<=b||y>b+3)return;

  var de=daysLeft(to),i;

  if(c.archived&&de<0)return {k:"mute",t:"Αρχειοθετήθηκε",sub:"Αρχειοθετήθηκε"+(c.archivedAt?" "+fmtDate(c.archivedAt):""),d:de,yr:null,archived:true};
  if(de<0)return {k:"bad",t:"Έληξε",sub:"Η σύμβαση έληξε "+dayTextEl(de),d:de,yr:null};
  if(from&&t<from){var ds=daysLeft(from);return {k:"ok",t:"Δεν ξεκίνησε",sub:"Ξεκινά "+dayTextEl(ds),d:ds,yr:null}}
  for(i=0;i<ys.length;i++){
    var d=daysLeft(ys[i].to);
    if(d!=null&&d>=0&&d<=(+ys[i].remind||30)){var last=i===ys.length-1;return {k:"warn",t:"Λήγει σύντομα",sub:(last?"Λήξη σύμβασης ":"Λήξη έτους "+(i+1)+" ")+dayTextEl(d),d:d,yr:i+1,last:last}}
  }
  var ci=-1;for(i=0;i<ys.length;i++){if(t>=ys[i].from&&t<=ys[i].to){ci=i;break}}
  return {k:"ok",t:"Σε ισχύ",sub:ci>=0?"Έτος "+(ci+1)+" από "+ys.length:"",d:de,yr:ci>=0?ci+1:null};
}
/* archived (expired) contracts are kept for reference only: no alerts, digest items or milestone notifications */
function ctExpired(c){var ys=c.years||[],to=c.dateTo||(ys.length?ys[ys.length-1].to:""),de=daysLeft(to);return de!=null&&de<0}
function attn(cat){return listOf(cat).filter(function(i){var s=cat==="ct"?ctInfo(i):status(i);return s.k!=="ok"&&!s.archived}).length}
function crossAlert(cat){
  var o=cat==="sw"?"ct":"sw",n=attn(o)+msAttn(o);if(!n)return "";
  return '<div class="alert"><span>'+(o==="ct"?'Συμβάσεις: '+n+' χρειάζονται προσοχή':'Λογισμικά: '+n+' need attention')+'</span><button type="button" data-act="gocat" data-cat="'+o+'">'+(o==="ct"?'Προβολή':'View')+'</button></div>';

function remOpts(v,list,suffix){
  var h=list.map(function(n){return '<option value="'+n+'"'+(+v===n?" selected":"")+'>'+n+suffix+'</option>'}).join("");
  if(list.indexOf(+v)<0&&+v)h+='<option value="'+(+v)+'" selected>'+(+v)+suffix+'</option>';

/* ---------- list ---------- */

/* ---------- contract amendments (Τροποποίηση Σύμβασης, v3.16.0) ----------
   The amendment form is the full contract form plus a description; every changed / added field shows its previous value,
   and the history (what changed, from what to what, the cost before and after) is stored on the contract (append-only). */
var AM_EX="π.χ. ΤΕΑΑ, ΚΕΑΑ, Συμπληρωματικός Προϋπολογισμός";
function amSnap(r){return {title:r.title||"",tender:r.tender||"",months:r.months,dateFrom:r.dateFrom||"",dateTo:r.dateTo||"",cost:Number(r.cost)||0,years:(r.years||[]).map(function(y){return {from:y.from||"",to:y.to||"",cost:y.cost===""||y.cost==null?"":Number(y.cost)}}),budget:(r.budget||[]).map(function(p){return {year:+p.year||1,amount:Number(p.amount)||0,article:String(p.article||"")}}),extras:(r.extras||[]).map(function(e){return {desc:e.desc||"",amount:Number(e.amount)||0,article:String(e.article||"")}})}}
function amArt(code){var a=code?artFind(code,articles()):null;return a?a.code+(a.desc?" – "+a.desc:""):(code?String(code):"χωρίς άρθρο")}
/* the comparable fields of a contract record: [{k,l,v}] with v the text shown to the user */
function amFields(r){
  var out=[];
  cwBase().forEach(function(f){
    var v;
    if(f.sel)v=r.contractor||"";else if(f.ctl)v=ctlName(r.contractId);else if(f.cf)v=(r.custom||{})[f.id];else v=r[f.k];
    if(v==null||v==="")v="";
    else if(f.date)v=fmtDate(v);else if(f.k==="cost")v=money(v);
    out.push({k:f.k,l:f.l.replace(/\s*\(€\)$/,""),v:String(v).trim()||"—"});
  });
  (r.years||[]).forEach(function(y,i){out.push({k:"y"+i,l:"Έτος "+(i+1)+" της σύμβασης",v:fmtDate(y.from)+" – "+fmtDate(y.to)+" · κόστος "+(y.cost===""||y.cost==null?"—":money(y.cost))})});
  var bp=(r.budget||[]).filter(function(p){return p.amount!==""&&p.amount!=null&&isFinite(Number(p.amount))&&Number(p.amount)!==0});
  out.push({k:"bp",l:"Επιμέρους ποσά ανά άρθρο",v:bp.length?bp.map(function(p){return "έτος "+(+p.year||1)+" · "+amArt(p.article)+" · "+money(p.amount)}).join("  |  "):"—"});
  if(S.cw.kind==="tn")return out;
  out.push({k:"rcInclude",l:"Συμπερίληψη στο Πλαίσιο Συμφιλίωσης",v:r.rcInclude?"Ναι":"Όχι"});
  var ex=(r.extras||[]).filter(function(e){return e&&(e.desc||Number(e.amount))});
  out.push({k:"ex",l:"Επιπρόσθετες / Προαιρετικές Υπηρεσίες",v:ex.length?ex.map(function(e){return (e.desc||"—")+" · "+money(e.amount)+"/έτος · "+amArt(e.article)}).join("  |  "):"—"});
  return out;
}
function amDiff(a,b){
  var am={},bm={},ks=[];
  a.forEach(function(x){am[x.k]=x});b.forEach(function(x){bm[x.k]=x;ks.push(x.k)});a.forEach(function(x){if(ks.indexOf(x.k)<0)ks.push(x.k)});
  var out=[];
  ks.forEach(function(k){var o=am[k],n=bm[k],ov=o?o.v:"—",nv=n?n.v:"—";if(ov!==nv)out.push({k:k,label:(n||o).l,old:ov,new:nv})});
  return out;
}
function ctAmend(id){

  var d0=JSON.parse(JSON.stringify(c));cfLoad(d0,"contracts");

/* previous-value notes under the changed fields + the summary; called on every input / change while the amendment form is open */
function amLive(){
  var w=S.cw;if(!w||!w.am||w.mode!=="full")return;
  ctCollect();
  var dd=Object.assign({},w.d);if((dd.years||[]).some(function(y){return y.cost!==""&&y.cost!=null}))dd.cost=r2(ctSum(dd.years));  /* same rule as on save */
  var rec=ctRecord(dd,w.kind||"ct"),nf=amFields(rec),of=amFields(w.am.base),om={},nm={};
  of.forEach(function(x){om[x.k]=x.v});nf.forEach(function(x){nm[x.k]=x.v});

function ctValidateBase(keys){
  var d=S.cw.d;
  for(var i=0;i<keys.length;i++){
    var f=cwBase().filter(function(x){return x.k===keys[i]})[0];if(!f)continue;
    var v=d[f.k],blank=v==null||String(v).trim()==="";
    if(f.cf){var ce=cfErr(f,v);if(ce)return ce}
    if(f.req&&blank)return f.l+": υποχρεωτικό πεδίο.";
    if(f.k==="months"&&!blank){var m=Number(v);if(!isFinite(m)||m<1||Math.floor(m)!==m)return "Η διάρκεια πρέπει να είναι ακέραιος αριθμός μηνών, π.χ. 62."}
    if(f.date&&!blank&&!parseIso(v))return f.l+": μη έγκυρη ημερομηνία.";
    if(f.email&&!blank&&emailsErr(v,1))return f.l+": "+emailsErr(v,1);
    if(f.phone&&!blank&&!/^\+?[0-9][0-9 ()\-./,;]{4,}$/.test(String(v).trim()))return f.l+": μη έγκυρο τηλέφωνο (ψηφία, κενά, + ( ) - . ; ,).";
    if(S.cw.kind==="tn"&&f.k==="tender"&&!blank){var dp=tnDup(v,S.cw.id);if(dp)return "Ο αριθμός διαγωνισμού «"+String(v).trim()+"» υπάρχει ήδη στον διαγωνισμό «"+dp.title+"». Κάθε διαγωνισμός πρέπει να έχει διαφορετικό αριθμό."}
    if(S.cw.kind!=="tn"&&f.k==="tender"&&!blank){var cd=ctDup(v,S.cw.id),cs=S.cw.id?getItem("ct",S.cw.id):null;if(cd&&!(cs&&tnKey(cs.tender)===tnKey(v)))return ctDupMsg(v,cd)}
    if(f.k==="cost"&&!blank&&(!isFinite(Number(v))||Number(v)<0))return "Το κόστος πρέπει να είναι αριθμός, π.χ. 12000.50.";
  }
  if(keys.indexOf("dateTo")>=0&&d.dateFrom&&d.dateTo&&d.dateTo<d.dateFrom)return "Η ημερομηνία λήξης πρέπει να είναι μετά την ημερομηνία έναρξης.";
  return "";
}

async function ctSave(){
  ctCollect();var w=S.cw,d=w.d;
  var e=ctValidateBase(cwBase().map(function(f){return f.k}));
  if(!e)e=bpErr(d,1);
  if(!e&&w.kind!=="tn")e=exErr(d);
  if(!e){
    if(!(d.years||[]).length)d.years=buildYears(d.dateFrom,d.months);
    for(var i=0;i<d.years.length&&!e;i++){
      var y=d.years[i],n="Έτος "+(i+1)+": ";
      if(!parseIso(y.from)||!parseIso(y.to))e=n+"συμπλήρωσε έγκυρες ημερομηνίες.";
      else if(y.to<y.from)e=n+"η λήξη είναι πριν την έναρξη.";
      else if(y.cost!==""&&y.cost!=null&&(!isFinite(Number(y.cost))||Number(y.cost)<0))e=n+"το κόστος πρέπει να είναι αριθμός.";
    }
  }
  if(e){w.err=e;var x=$("#werr");if(x)x.textContent=e;return}
  /* on every save the contract cost is filled from the sum of the years (same as the "Συμπλήρωση ΚΟΣΤΟΥΣ από το άθροισμα ετών" button) when at least one year has a cost */
  if((d.years||[]).some(function(y){return y.cost!==""&&y.cost!=null}))d.cost=r2(ctSum(d.years));
  var tn=w.kind==="tn",rec=ctRecord(d,w.kind),id=w.id||uid();
  if(w.am){
    var ad=String(w.am.desc||"").trim(),ach=amDiff(amFields(w.am.base),amFields(rec)),ae="";
    if(!ad)ae="Η περιγραφή της τροποποίησης είναι υποχρεωτική ("+AM_EX+").";
    else if(!parseIso(w.am.date))ae="Η ημερομηνία τροποποίησης δεν είναι έγκυρη.";
    else if(!ach.length)ae="Δεν έγινε καμία αλλαγή.";
    if(ae){w.err=ae;var ax=$("#werr");if(ax)ax.textContent=ae;return}
    rec.amendments=(w.am.base.amendments||[]).concat([{id:uid(),date:w.am.date,description:ad,at:Date.now(),changes:ach.map(function(x){return {label:x.label,old:x.old,new:x.new}}),costBefore:ctTotal(w.am.base),costAfter:ctTotal(rec),before:amSnap(w.am.base)}]);
  }
  if(w.promoteFrom){
    if(await tnPromoteDo(w.promoteFrom,id,rec)){closePanel();toast("Ο διαγωνισμός προωθήθηκε στις Συμβάσεις");S.cat="ct";S.filter="all";S.q="";$("#q").value="";try{localStorage.setItem("rl.cat","ct")}catch(e){}render();showCtDetail(id)}
    return;
  }
  if(await save(id,rec,tn?"tn":"ct")){closePanel();toast(w.id?"Αποθηκεύτηκε":"Προστέθηκε: "+rec.title);if(!w.id||w.am)(tn?showTnDetail:showCtDetail)(id)}
}
/* ---------- tenders (Διαγωνισμοί): same form as the contracts, without reminders ---------- */
function tnActive(t){return (t.status||"active")==="active"}
/* A tender number is compared without case and spaces ("12 / 2024" = "12/2024"); returns the other live tender that already uses it. */
function tnKey(s){return String(s==null?"":s).replace(/\s+/g,"").toUpperCase()}
function tnDup(num,exceptId){var k=tnKey(num);if(!k)return null;return (S.tenders||[]).filter(function(t){return t.id!==exceptId&&tnKey(t.tender)===k})[0]||null}
/* Same rule for contracts (v3.15.0): another live contract with the same tender number blocks a new contract; an existing one is only checked when its number was changed. */
function ctDup(num,exceptId){var k=tnKey(num);if(!k)return null;return (S.contracts||[]).filter(function(c){return c.id!==exceptId&&tnKey(c.tender)===k})[0]||null}
function ctDupMsg(num,dp){return "Υπάρχει ήδη Σύμβαση καταχωρημένη με τον ίδιο αριθμό διαγωνισμού «"+String(num).trim()+"»: «"+dp.title+"». Δεν μπορεί να καταχωρηθεί δεύτερη σύμβαση με τον ίδιο αριθμό."}
function tnInfo(t){
  var s=t.status||"active";
  if(s==="pending")return {k:"warn",t:"Σε αναμονή έγκρισης",sub:t.autoCreated?"Αυτόματη δημιουργία":""};
  if(s==="cancelled")return {k:"bad",t:"Ακυρώθηκε",sub:t.statusAt?fmtDate(t.statusAt):""};
  if(s==="promoted")return {k:"mute",t:"Προωθήθηκε σε Σύμβαση",sub:t.statusAt?fmtDate(t.statusAt):""};
  return {k:"ok",t:"Ενεργός",sub:""};
}
function tnStart(id){
  var t=id?getItem("tn",id):null;
  S.cw={id:id||null,kind:"tn",mode:t?"full":"step",i:0,err:"",d:t?JSON.parse(JSON.stringify(t)):{months:"",dateFrom:todayIso(),years:[],status:"active"}};

function coAddr(c){return [c.address,c.address2,[c.postal,c.city].filter(Boolean).join(" "),c.country].filter(function(x){return x&&String(x).trim()}).join(", ")}
function coKey(s){return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim().toUpperCase()}
function coById(id){return id?((S.contractors||[]).filter(function(x){return x.id===id})[0]||null):null}
/* The contractor of a contract: the registered contractor when linked, otherwise the older free-text fields of the contract. */
function ctrOf(c){
  var r=coById(c.contractorId);
  if(r)return {linked:true,id:r.id,name:r.name||"",vat:"",addr:coAddr(r),contact:r.contact||"",phone:r.phone||"",email:r.email||""};
  return {linked:false,id:c.contractorId||"",name:c.contractor||"",vat:c.contractorVat||"",addr:c.contractorAddress||"",contact:c.contractorContact||"",phone:c.contractorPhone||"",email:c.contractorEmail||""};
}

function coDup(name,vat,exceptId){
  var nk=coKey(name);
  return (S.contractors||[]).filter(function(x){return x.id!==exceptId&&nk&&coKey(x.name)===nk})[0]||null;
}
/* active contract = in force, expiring soon or not started yet (not expired) */
function coActive(c){var t=ctInfo(c).t;return t==="Σε ισχύ"||t==="Λήγει σύντομα"||t==="Δεν ξεκίνησε"}
function coContracts(id){return S.contracts.filter(function(c){return c.contractorId===id})}
function coStats(id){
  var n=0,seen={},list=[];
  coContracts(id).forEach(function(c){if(!coActive(c))return;n++;var k=tnKey(c.tender);if(k&&!seen[k]){seen[k]=1;list.push(String(c.tender).trim())}});
  return {n:n,tenders:list};
}

  var q=S.q.toLowerCase();
  return sortList("co",(S.contractors||[]).filter(function(c){
    var n=coStats(c.id).n;
    if(S.filter==="withact"&&!n)return false;

async function coMigrate(){

  var groups={},order=[];
  legacy.forEach(function(c){var k=coKey(c.contractor);if(!groups[k]){groups[k]=[];order.push(k)}groups[k].push(c)});
  if(!window.confirm("Θα δημιουργηθούν ή θα συνδεθούν "+order.length+" ανάδοχοι για "+legacy.length+" συμβάσεις (ίδιο όνομα = ένας ανάδοχος). Τα στοιχεία (διεύθυνση, επικοινωνία) περνούν από τη σύμβαση στον ανάδοχο. Συνέχεια;"))return;
  var made=0,linked=0;
  for(var i=0;i<order.length;i++){
    var cs=groups[order[i]],ex=(S.contractors||[]).filter(function(x){return coKey(x.name)===order[i]})[0],id,name;
    if(ex){id=ex.id;name=ex.name}
    else{
      var src=cs.filter(function(c){return c.contractorVat||c.contractorAddress||c.contractorContact||c.contractorPhone||c.contractorEmail})[0]||cs[0];
      name=String(cs[0].contractor).trim();

      id=uid();
      if(!(await save(id,rec,"co")))continue;
      made++;

    }

      var r=strip(cs[j]);r.contractorId=id;r.contractor=name;["contractorVat","contractorAddress","contractorContact","contractorPhone","contractorEmail"].forEach(function(k){r[k]=""});

}
