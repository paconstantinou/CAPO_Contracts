/*GUIDE-START*/var GUIDE_HTML="<p class=\"hint\">Οδηγός χρήσης του PROCURE360 · ισχύει για την έκδοση 3.22.0. Πάτησε σε ένα θέμα για να πας κατευθείαν σε αυτό.<\/p>\n<div class=\"gtoc\">\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"intro\">Επισκόπηση<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"start\">Πρώτα βήματα<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"sw\">Λογισμικά<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"ct\">Συμβάσεις<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"tn\">Διαγωνισμοί<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"pv\">Γενικές Πρόνοιες<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"own\">Ιδιοκτήτες εγγραφών<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"bd\">Προϋπολογισμός<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"rc\">Πλαίσιο Συμφιλίωσης<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"ar\">Άρθρα<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"co\">Ανάδοχοι<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"ms\">Milestones<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"att\">Συνημμένα<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"trash\">Κάδος και αναίρεση<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"rem\">Υπενθυμίσεις<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"xl\">Excel<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"cfg\">Ρυθμίσεις εφαρμογής<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"set\">Ρυθμίσεις και δικαιώματα<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"data\">Δεδομένα και αντίγραφα<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"sec\">Ασφάλεια και ίχνη ελέγχου<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"faq\">Συχνές ερωτήσεις<\/button>\n<button type=\"button\" class=\"chip\" data-act=\"gsec\" data-id=\"new\">Τι νέο υπάρχει<\/button>\n<\/div>\n\n<h3 id=\"g-intro\">Επισκόπηση<\/h3>\n<p>Το PROCURE360 συνδέει σε ένα σημείο τις αγορές λογισμικού, τις συμβάσεις, τους μελλοντικούς διαγωνισμούς και τον προγραμματισμό του προϋπολογισμού. Έχει πέντε καρτέλες:<\/p>\n<ul>\n<li><b>Λογισμικά:<\/b> συνδρομές λογισμικού με ημερομηνία λήξης και ανανέωση.<\/li>\n<li><b>Συμβάσεις:<\/b> συμβάσεις πολλών ετών, με κόστος και υπενθύμιση ανά έτος και milestones.<\/li>\n<li><b>Ανάδοχοι:<\/b> η λίστα των αναδόχων, από την οποία επιλέγονται στις Συμβάσεις.<\/li>\n<li><b>Διαγωνισμοί:<\/b> νέοι διαγωνισμοί που προτίθεται να διενεργήσει ο Οργανισμός, με εκτιμώμενα ποσά.<\/li>\n<li><b>Προϋπολογισμός:<\/b> πίνακες ανά άρθρο, που συμπληρώνονται αυτόματα από τα ποσά των τριών προηγούμενων καρτελών.<\/li>\n<li><b>Άρθρα:<\/b> η λίστα των άρθρων προϋπολογισμού του Οργανισμού.<\/li>\n<\/ul>\n<p>Οι εγγραφές των τριών πρώτων καρτελών κρατούν ποσά <b>χωρίς ΦΠΑ<\/b>. Ο Προϋπολογισμός προσθέτει ΦΠΑ (προεπιλογή 19%, αλλάζει από τις Ρυθμίσεις).<\/p>\n\n<h3 id=\"g-start\">Πρώτα βήματα<\/h3>\n<ul>\n<li>Διάλεξε καρτέλα και πάτησε το πράσινο κουμπί πάνω δεξιά («+ Add software», «+ Νέα σύμβαση», «+ Νέος διαγωνισμός»).<\/li>\n<li>Η φόρμα ανοίγει <b>βήμα-βήμα<\/b> (μία ερώτηση κάθε φορά). Με το «Πλήρης φόρμα» βλέπεις όλα τα πεδία μαζί.<\/li>\n<li>Οι φόρμες (Λογισμικά, Συμβάσεις, Διαγωνισμοί) ανοίγουν σε <b>πλήρη οθόνη<\/b> και <b>δεν κλείνουν κατά λάθος<\/b>: ούτε με κλικ έξω από τη φόρμα ούτε με το Backspace. Το Esc και το «Άκυρο» ρωτούν πρώτα αν θέλεις να χάσεις ό,τι έχεις γράψει. Αν δοκιμάσεις να φύγεις από τη σελίδα με μισοσυμπληρωμένη φόρμα, ο browser ζητά επιβεβαίωση.<\/li>\n<li>Η αναζήτηση πάνω από τη λίστα φιλτράρει με ό,τι πληκτρολογείς. Τα κουμπιά φίλτρου (chips) περιορίζουν ανά κατάσταση. Πεδίο αναζήτησης υπάρχει <b>σε κάθε σελίδα<\/b>: στις λίστες ψάχνει στις εγγραφές, στον <b>Προϋπολογισμό<\/b> στα άρθρα και τις γραμμές δαπανών (τα «Σύνολα» κάθε πίνακα αφορούν τις γραμμές που εμφανίζονται), στις <b>Ρυθμίσεις<\/b> εμφανίζει μόνο τις ενότητες που περιέχουν το κείμενο, και ο <b>Οδηγός<\/b> έχει δικό του πεδίο αναζήτησης στην κορυφή.<\/li>\n<li>Με το «⚙ Στήλες» διαλέγεις ποιες στήλες φαίνονται, με ποια σειρά και ποια ταξινομεί τη λίστα.<\/li>\n<li>Στο WordPress βλέπεις μόνο τις καρτέλες και τις ενέργειες που σου επιτρέπει ο ρόλος σου. Αν λείπει κάποιο κουμπί, ζήτα το δικαίωμα από τον διαχειριστή.<\/li>\n<\/ul>\n\n<h3 id=\"g-sw\">Λογισμικά<\/h3>\n<p><b>Πεδία:<\/b> Software Name, Description, Vendor, Website, Username, Date From, Date To, Cost excl. VAT (€), Notification emails (για περισσότερα από ένα χρησιμοποίησε κόμμα (,) ή ερωτηματικό (;)) και η υπενθύμιση (7, 14, 30, 60 ή 90 ημέρες πριν τη λήξη). Δεν αποθηκεύονται κωδικοί πρόσβασης.<\/p>\n<p><b>Κατάσταση:<\/b> «Active», «Due soon» (μέσα στις ημέρες υπενθύμισης) ή «Expired».<\/p>\n<p><b>Ανανέωση:<\/b> άνοιξε την εγγραφή και πάτησε «Renew…». Δίνεις νέες ημερομηνίες και κόστος, και η προηγούμενη περίοδος κρατιέται στο ιστορικό ανανεώσεων. <b>Τα συνημμένα (τιμολόγια, αποδείξεις) πηγαίνουν στην περίοδο που λήγει:<\/b> στην οθόνη της ανανέωσης εμφανίζονται όλα τα συνημμένα με τικ· όσα έχουν τικ μεταφέρονται στην προηγούμενη περίοδο και η νέα περίοδος ξεκινά χωρίς αυτά. Ξετίκαρε ένα αρχείο που συνεχίζει να ισχύει (π.χ. άδεια ή συμφωνητικό) για να μείνει στα τρέχοντα συνημμένα. Στο «Previous period» κάθε περίοδος έχει δικά της αρχεία, με το κουμπί «+ Attach files to this period» για προσθήκη (π.χ. τιμολόγιο που έρχεται μετά την ανανέωση) και «Remove» για αφαίρεση. Η εξαγωγή και το αντίγραφο ασφαλείας τα περιλαμβάνουν· τα προηγούμενα αρχεία φαίνονται στην εξαγωγή με την περίοδό τους.<\/p>\n<p><b>Σημείωμα ανανέωσης:<\/b> άνοιξε την εγγραφή και πάτησε «Ετοιμασία Σημειώματος». Ανοίγει φόρμα με προσυμπληρωμένα στοιχεία: ημερομηνία σήμερα, όνομα και περιγραφή του λογισμικού, <b>επόμενη περίοδος ανανέωσης<\/b> (από την επομένη της λήξης, για ένα έτος), κόστος και άρθρο προϋπολογισμού (το πρώτο άρθρο των επιμέρους ποσών, αν υπάρχει). Διόρθωσέ τα αν χρειάζεται και πάτα «Δημιουργία Σημειώματος (.docx)»: κατεβαίνει αρχείο Word με τη μορφοποίηση του προτύπου. Η δαπάνη δεν καταχωρείται εκεί· η ανανέωση γίνεται από το «Renew…». Οι υπογραφές και ο «ΑΡ. ΦΑΚ» μένουν όπως είναι στο πρότυπο.<\/p>\n<p><b>Επιμέρους ποσά και άρθρα:<\/b> στην ενότητα «Cost breakdown» της εγγραφής πατάς «+ Add partial amount» και χωρίζεις το κόστος σε μέρη, διαλέγοντας για κάθε μέρος το άρθρο προϋπολογισμού. Έτσι περνά στον Προϋπολογισμό. Αν δεν δώσεις επιμέρους ποσά, μπαίνει ολόκληρο το κόστος χωρίς άρθρο.<\/p>\n\n<h3 id=\"g-ct\">Συμβάσεις<\/h3>\n<p><b>Πεδία:<\/b> Σύμβαση, Αριθμός διαγωνισμού, Περιγραφή, Ανάδοχος, Συντονιστής, Διάρκεια (μήνες), Ημερομηνία έναρξης και λήξης, Κόστος, Emails ειδοποιήσεων (για περισσότερα από ένα χρησιμοποίησε κόμμα (,) ή ερωτηματικό (;)).<\/p>\n<p><b>Μοναδικός αριθμός διαγωνισμού:<\/b> δεν επιτρέπεται δεύτερη σύμβαση με τον ίδιο αριθμό διαγωνισμού. Αν προσπαθήσεις να καταχωρήσεις (ή να εισαγάγεις από Excel, ή να προωθήσεις από Διαγωνισμό, ή να επαναφέρεις από τον κάδο) σύμβαση με αριθμό που ήδη έχει άλλη σύμβαση, εμφανίζεται μήνυμα «Υπάρχει ήδη Σύμβαση καταχωρημένη με τον ίδιο αριθμό διαγωνισμού» με τον τίτλο της υπάρχουσας και η σύμβαση δεν αποθηκεύεται. Η σύγκριση αγνοεί κενά και κεφαλαία/πεζά (το «12 / 2024» είναι ίδιο με το «12/2024»). Παλιές συμβάσεις που ήδη έχουν κοινό αριθμό μπορούν να επεξεργαστούν κανονικά όσο δεν αλλάζεις τον αριθμό τους. Συμβάσεις χωρίς αριθμό διαγωνισμού δεν ελέγχονται.<\/p>\n<p><b>Ανάδοχος:<\/b> επιλέγεται από λίστα (drop-down) με τους αναδόχους της καρτέλας «Ανάδοχοι». Αν ο ανάδοχος δεν υπάρχει, πατάς «+ Νέος ανάδοχος»: ανοίγει η φόρμα αναδόχου και μετά την αποθήκευση επιστρέφεις στη σύμβαση με τον ανάδοχο επιλεγμένο, χωρίς να χαθεί ό,τι είχες συμπληρώσει. Τα στοιχεία του αναδόχου (διεύθυνση, άτομο επικοινωνίας, τηλέφωνο, email) εμφανίζονται στη σύμβαση <b>μόνο για ανάγνωση<\/b>· αλλάζουν αποκλειστικά από την καρτέλα «Ανάδοχοι».<\/p>\n<p><b>Αντιπρόσωπος αναδόχου για τη σύμβαση:<\/b> επειδή το άτομο επικοινωνίας μπορεί να διαφέρει ανά σύμβαση, κάθε σύμβαση έχει δικά της πεδία Ονοματεπώνυμο, Τηλέφωνο και Email αντιπροσώπου (προαιρετικά· τηλέφωνο και email μπορεί να είναι περισσότερα, χωρισμένα με κόμμα ή ερωτηματικό). Περιλαμβάνονται στην αναζήτηση και στο Excel (εξαγωγή και εισαγωγή). Το email είναι πληροφοριακό: οι ειδοποιήσεις στέλνονται μόνο στα «Email ειδοποιήσεων».<\/p>\n<p><b>Παλιές συμβάσεις:<\/b> συμβάσεις που είχαν ανάδοχο ως ελεύθερο κείμενο διατηρούν τα παλιά τους στοιχεία μέχρι να επιλέξεις ανάδοχο. Στην καρτέλα «Ανάδοχοι» το κουμπί «Δημιουργία αναδόχων από τις συμβάσεις» τους δημιουργεί αυτόματα (ίδιο όνομα = ένας ανάδοχος) και συνδέει τις συμβάσεις.<\/p>\n<p><b>Έτη σύμβασης:<\/b> δημιουργούνται αυτόματα από τη διάρκεια και την ημερομηνία έναρξης. Οι επιπλέον μήνες πέρα από τα πλήρη έτη προστίθενται στο 1ο έτος. Για κάθε έτος βάζεις κόστος και υπενθύμιση (14, 30, 60, 90, 120 ή 180 ημέρες πριν τη λήξη του έτους).<\/p>\n<p><b>Επιμέρους ποσά:<\/b> κάτω από κάθε έτος πατάς «+ Επιμέρους ποσό», επιλέγεις άρθρο προϋπολογισμού και γράφεις το ποσό. Το κόστος του έτους γίνεται το άθροισμα των ποσών. Δες την ενότητα «Προϋπολογισμός» για το πώς περνούν.<\/p>\n<p><b>Αρχειοθέτηση (Archive):<\/b> όταν μια σύμβαση έχει λήξει, στο κάτω μέρος των λεπτομερειών της εμφανίζεται το κουμπί «Αρχειοθέτηση» (είναι ανενεργό όσο η σύμβαση δεν έχει λήξει). Η αρχειοθετημένη σύμβαση <b>δεν στέλνει πλέον καμία ειδοποίηση<\/b> (ούτε email λήξης, ούτε υπενθυμίσεις ετών/milestones, ούτε εμφανίζεται στο «Needs your attention» και στις ειδοποιήσεις της κορυφής) και δεν μετράει στους μετρητές «Έληξαν». Παραμένει στις Συμβάσεις για αναφορά: τη βρίσκεις στο φίλτρο «Αρχείο» και στο «Όλες», με κατάσταση «Αρχειοθετήθηκε». Με το κουμπί «Επαναφορά από το Αρχείο» γυρίζει στην κανονική της κατάσταση. Αν παρατείνεις τη λήξη μιας αρχειοθετημένης σύμβασης, γίνεται αυτόματα ξανά ενεργή.<\/p>\n<p><b>Κόστος σύμβασης:<\/b> σε κάθε αποθήκευση το ΚΟΣΤΟΣ της σύμβασης συμπληρώνεται αυτόματα από το άθροισμα των ετών (όπως το κουμπί «Συμπλήρωση ΚΟΣΤΟΥΣ από το άθροισμα ετών», που μπορείς να πατήσεις και χειροκίνητα). Αν κανένα έτος δεν έχει κόστος, το ΚΟΣΤΟΣ μένει όπως το έγραψες.<\/p>\n<p><b>Επιπρόσθετες / Προαιρετικές Υπηρεσίες:<\/b> στη φόρμα της σύμβασης, κάτω από τα έτη, πατάς «+ Υπηρεσία» για κάθε επιπρόσθετη ή προαιρετική υπηρεσία που περιλαμβάνεται στη σύμβαση (όσες χρειάζονται). Για κάθε μία γράφεις περιγραφή, το <b>ποσό που αφορά ένα έτος της σύμβασης<\/b> (χωρίς ΦΠΑ) και το άρθρο προϋπολογισμού. Το ποσό <b>προστίθεται μόνο στο συνολικό κόστος<\/b> της σύμβασης (π.χ. 2 έτη × 1.500 € υπηρεσίες = +3.000 €), όχι στο κόστος κάθε έτους· η φόρμα δείχνει ζωντανά το ετήσιο σύνολο των υπηρεσιών και το συνολικό κόστος με τις υπηρεσίες. Τα ποσά των ετών δεν αλλάζουν.<\/p>\n<p><b>Στον Προϋπολογισμό:<\/b> κάθε υπηρεσία περνά στο άρθρο που όρισες, για κάθε έτος της σύμβασης, <b>κατανεμημένη ανά μήνα<\/b> στα ημερολογιακά έτη που καλύπτει (π.χ. 1.200 € για 01/07–30/06: 6 μήνες στο πρώτο ημερολογιακό έτος και 6 στο επόμενο), πάντα με ΦΠΑ όπως τα υπόλοιπα ποσά, ανεξάρτητα από την επιλογή «Ανάλυση ανά έτος» του άρθρου. Στη στήλη «Πώς προκύπτει» φαίνεται η περιγραφή της υπηρεσίας και το έτος της σύμβασης. Ένα άρθρο που χρησιμοποιείται σε υπηρεσίες μετράει στη χρήση του και δεν διαγράφεται εύκολα. Οι υπηρεσίες εμφανίζονται και στο Excel των συμβάσεων (δύο νέες στήλες· το ΚΟΣΤΟΣ περιλαμβάνει τις υπηρεσίες) και δεν περιλαμβάνονται στην εισαγωγή από Excel.<\/p>\n<p><b>Τροποποίηση σύμβασης:<\/b> στις λεπτομέρειες μιας σύμβασης πατάς «Τροποποίηση σύμβασης». Ανοίγει η φόρμα της σύμβασης και, για κάθε πεδίο που αλλάζεις ή προσθέτεις, εμφανίζεται από κάτω η <b>προηγούμενη τιμή<\/b> («Προηγούμενη τιμή: …», ή «— (νέα καταχώρηση)» αν το πεδίο ήταν κενό). Πάνω στη φόρμα συμπληρώνεις υποχρεωτικά την <b>περιγραφή της τροποποίησης<\/b> (π.χ. ΤΕΑΑ, ΚΕΑΑ, Συμπληρωματικός Προϋπολογισμός) και την ημερομηνία της. Μια περίληψη «Πεδίο / Προηγούμενη τιμή / Νέα τιμή» ενημερώνεται όσο πληκτρολογείς· αν δεν έχει αλλάξει τίποτα, η αποθήκευση δεν γίνεται. Στις λεπτομέρειες εμφανίζεται το ιστορικό «Τροποποιήσεις σύμβασης»: κάθε τροποποίηση με ημερομηνία, περιγραφή, κόστος πριν και μετά, και τις αλλαγές «από → σε». Το ιστορικό μόνο προστίθεται· δεν σβήνεται ούτε αλλάζει (στο WordPress το διασφαλίζει ο server και κάθε τροποποίηση γράφεται στο αρχείο δραστηριότητας). Η κανονική «Επεξεργασία» δεν δημιουργεί τροποποίηση.<\/p>\n<p><b>Κατάσταση:<\/b> «Δεν ξεκίνησε», «Ενεργή», «Λήγει σύντομα» (λήξη έτους ή σύμβασης μέσα στις ημέρες υπενθύμισης) ή «Έληξε».<\/p>\n\n<h3 id=\"g-tn\">Διαγωνισμοί<\/h3>\n<p>Εδώ καταγράφονται οι νέοι διαγωνισμοί που σκοπεύει να διενεργήσει ο Οργανισμός.<\/p>\n<p><b>Πεδία:<\/b> Όνομα διαγωνισμού, Αριθμός διαγωνισμού (<b>μοναδικός<\/b>: δεν μπορούν δύο διαγωνισμοί να έχουν τον ίδιο αριθμό, ανεξάρτητα από κεφαλαία/πεζά και κενά, π.χ. «12 / 2027» = «12/2027»· αριθμός διαγωνισμού που βρίσκεται μόνο στον Κάδο μπορεί να ξαναχρησιμοποιηθεί, αλλά τότε η επαναφορά του από τον Κάδο απορρίπτεται όσο ο αριθμός χρησιμοποιείται), Περιγραφή, Διάρκεια (μήνες), Εκτιμώμενη ημερομηνία έναρξης και λήξης, Εκτιμώμενο κόστος. Τα <b>Έτη<\/b> δημιουργούνται αυτόματα από τη διάρκεια, όπως στις Συμβάσεις, αλλά χωρίς υπενθύμιση. Σε κάθε έτος βάζεις επιμέρους ποσά με το σχετικό άρθρο. Τα συνημμένα προστίθενται στο παράθυρο της εγγραφής.<\/p>\n<p><b>Προϋπολογισμός:<\/b> όσο ο διαγωνισμός είναι <b>ενεργός<\/b>, τα ποσά του περιλαμβάνονται στον Προϋπολογισμό με σημείωση «Εκτιμώμενος διαγωνισμός».<\/p>\n<p><b>Δύο επιλογές μέσα στον διαγωνισμό:<\/b><\/p>\n<ul>\n<li><b>Ακύρωση και αποθήκευση για αναφορά:<\/b> ο διαγωνισμός μένει στη λίστα ως «Ακυρώθηκε» και αφαιρείται από τον Προϋπολογισμό. Μπορείς να τον επανενεργοποιήσεις με το «Επανενεργοποίηση».<\/li>\n<li><b>Promote στις Συμβάσεις και αποθήκευση για αναφορά:<\/b> ανοίγει η φόρμα Σύμβασης προσυμπληρωμένη από τον διαγωνισμό. Συμπληρώνεις τα υπόλοιπα (π.χ. ανάδοχος, συντονιστής, υπενθυμίσεις) και διορθώνεις ό,τι χρειάζεται, και η σύμβαση δημιουργείται μόνο όταν πατήσεις την αποθήκευση. Ο διαγωνισμός μένει ως «Προωθήθηκε σε Σύμβαση», με σύνδεσμο προς τη σύμβαση, και αφαιρείται από τον Προϋπολογισμό. Από εδώ και πέρα τα ποσά μπαίνουν στον Προϋπολογισμό μέσω της σύμβασης. Τα συνημμένα του διαγωνισμού αντιγράφονται στη σύμβαση.<\/li>\n<\/ul>\n<p><b>Τροποποίηση Διαγωνισμού (3.20.0):<\/b> ένας <b>ενεργός<\/b> διαγωνισμός έχει και το κουμπί «Τροποποίηση Διαγωνισμού». Ανοίγει η ίδια φόρμα με την επεξεργασία, με περιγραφή και ημερομηνία της τροποποίησης (υποχρεωτική περιγραφή). Για κάθε πεδίο που αλλάζει ή προστίθεται εμφανίζεται η <b>προηγούμενη τιμή<\/b>, και οι τροποποιήσεις καταγράφονται στο ιστορικό του διαγωνισμού (δεν σβήνονται).<\/p>\n<p><b>Σχετιζόμενη σύμβαση (3.20.0):<\/b> κάθε διαγωνισμός συνδέεται με τη σύμβαση στην οποία αναφέρεται. Στους διαγωνισμούς που δημιουργούνται χειροκίνητα υπάρχει πεδίο επιλογής «Σχετιζόμενη σύμβαση»· η καρτέλα της σύμβασης δείχνει τους σχετιζόμενους διαγωνισμούς.<\/p>\n<p><b>Αυτόματοι διαγωνισμοί (3.20.0):<\/b> κάθε 5 Ιανουαρίου δημιουργείται, για κάθε σύμβαση που λήγει στο τρέχον έτος +1, +2 ή +3 και δεν έχει ήδη σχετιζόμενο διαγωνισμό, ένας διαγωνισμός σε κατάσταση <b>«Σε αναμονή έγκρισης»<\/b> (Όνομα, Περιγραφή, Διάρκεια, Έτη όπως στη σύμβαση· έναρξη = η επόμενη ημέρα από τη λήξη της σύμβασης· λήξη αυτόματα· εκτιμώμενο κόστος = Κόστος σύμβασης × 10%). Ο διαγωνισμός δεν μετράει στον Προϋπολογισμό μέχρι να εγκριθεί (κουμπιά «Έγκριση» / «Απόρριψη»). Στο WordPress τρέχει στον διακομιστή· στις αυτόνομες εκδόσεις τρέχει όταν ανοίξει η εφαρμογή την 5η Ιανουαρίου ή αργότερα. Στις Ρυθμίσεις υπάρχει κουμπί «Δημιουργία τώρα» για διαχειριστές.<\/p>\n<p>Ένας ακυρωμένος ή προωθημένος διαγωνισμός δεν προωθείται ξανά. Στο WordPress το Promote απαιτεί δικαίωμα επεξεργασίας διαγωνισμών και δημιουργίας συμβάσεων.<\/p>\n\n<h3 id=\"g-pv\">Γενικές Πρόνοιες<\/h3>\n<p>Εδώ καταγράφονται γενικές πρόνοιες για σκοπούς προϋπολογισμού. Με «+ Νέα Γενική Πρόνοια» συμπληρώνεις:<\/p>\n<ul>\n<li><b>Περιγραφή<\/b> και προαιρετικές σημειώσεις.<\/li>\n<li><b>Σχετικό άρθρο<\/b> προϋπολογισμού (υποχρεωτικό).<\/li>\n<li><b>Ποσά για τα επόμενα 3 έτη<\/b> μετά το έτος καταχώρησης: αν καταχωρείς το 2026, δίνονται ποσά για 2027, 2028 και 2029. Τα ποσά δίνονται <b>χωρίς ΦΠΑ<\/b>· πρέπει να συμπληρώσεις τουλάχιστον ένα. Τα έτη μένουν σταθερά όπως ορίστηκαν κατά την καταχώρηση.<\/li>\n<li><b>Συνημμένα:<\/b> μετά την πρώτη αποθήκευση ανοίγουν οι λεπτομέρειες της πρόνοιας, όπου προσθέτεις ή αφαιρείς αρχεία («+ Προσθήκη αρχείων»).<\/li>\n<\/ul>\n<p><b>Στον Προϋπολογισμό:<\/b> το ποσό κάθε έτους περνά στο σχετικό άρθρο, ολόκληρο στο ημερολογιακό έτος του, με προσθήκη ΦΠΑ (όπως ορίζεται στις Ρυθμίσεις), σε δική του γραμμή με δικό της χρώμα. Πρόνοια στον Κάδο δεν υπολογίζεται. Η αναζήτηση, η διαγραφή στον Κάδο και η επαναφορά λειτουργούν όπως στις άλλες καρτέλες. Στο WordPress η ενότητα έχει δικά της δικαιώματα στο Application Management (module «provisions»).<\/p>\n\n<h3 id=\"g-own\">Ιδιοκτήτες και ορατότητα εγγραφών (WordPress)<\/h3>\n<p>Στα <b>Λογισμικά, Συμβάσεις, Διαγωνισμούς και Γενικές Πρόνοιες<\/b> κάθε εγγραφή έχει <b>ιδιοκτήτη<\/b>. Στις Συμβάσεις ο ιδιοκτήτης είναι ο <b>Συντονιστής<\/b> (επιλέγεται από λίστα χρηστών WordPress με πρόσβαση στην εφαρμογή). Στις άλλες τρεις καρτέλες είναι ο <b>Υπεύθυνος<\/b>· από προεπιλογή είναι όποιος δημιουργεί την εγγραφή, και μπορεί να οριστεί άλλος.<\/p>\n<ul>\n<li><b>Ποιος βλέπει τι:<\/b> όποιος έχει το δικαίωμα <b>«Βλέπει όλες τις εγγραφές» (view_all)<\/b> στην ενότητα βλέπει όλες τις εγγραφές. Όποιος δεν το έχει βλέπει και αλλάζει <b>μόνο τις δικές του<\/b>. Οι ξένες εγγραφές δεν φτάνουν καν στον browser· ισχύει και για αναζήτηση, εξαγωγή, συνημμένα και προειδοποιήσεις διπλότυπων.<\/li>\n<li><b>Προειδοποίηση:<\/b> αν στη δημιουργία ορίσεις ως ιδιοκτήτη άλλον χρήστη, εμφανίζεται προειδοποίηση «Θα πάψετε να βλέπετε αυτή την εγγραφή» πριν την αποθήκευση.<\/li>\n<li><b>Αλλαγή ιδιοκτήτη:<\/b> σε υπάρχουσα εγγραφή μπορεί να την αλλάξει μόνο όποιος έχει «Βλέπει όλες τις εγγραφές». Οι υπόλοιποι ορίζουν ιδιοκτήτη μόνο στη δημιουργία.<\/li>\n<li><b>Προϋπολογισμός και Πλαίσιο Συμφιλίωσης<\/b> αθροίζουν όλες τις εγγραφές, γι' αυτό <b>κρύβονται<\/b> από όσους δεν έχουν «Βλέπει όλες τις εγγραφές».<\/li>\n<li><b>Διαγωνισμοί:<\/b> οι αυτόματοι διαγωνισμοί της 5ης Ιανουαρίου παίρνουν τον ιδιοκτήτη της σύμβασης. Όταν ένας διαγωνισμός προωθείται σε σύμβαση, ο ιδιοκτήτης του γίνεται Συντονιστής της σύμβασης.<\/li>\n<li><b>Υπενθυμίσεις:<\/b> το email υπενθύμισης στέλνεται και στον ιδιοκτήτη της εγγραφής, επιπλέον των υπαρχόντων παραληπτών.<\/li>\n<li><b>Excel:<\/b> στην εισαγωγή συμβάσεων το όνομα Συντονιστή αντιστοιχίζεται σε χρήστη· αν δεν βρεθεί, ιδιοκτήτης γίνεται όποιος κάνει την εισαγωγή (εμφανίζεται μήνυμα με το πλήθος).<\/li>\n<li><b>Κοινά για όλους:<\/b> Ανάδοχοι, Άρθρα και Ρυθμίσεις δεν έχουν ιδιοκτήτη.<\/li>\n<\/ul>\n<p><b>Για διαχειριστές:<\/b> το «view_all» δίνεται ανά ρόλο, ανά χρήστη και ανά ενότητα στο Application Management. Στην αναβάθμιση σε 3.21.0 όλοι οι ρόλοι και οι χρήστες που έχουν «view» παίρνουν αυτόματα και «view_all», άρα <b>τίποτα δεν αλλάζει<\/b> μέχρι να το αφαιρέσεις. Ρόλοι που δημιουργούνται αργότερα δεν το έχουν και βλέπουν μόνο τις δικές τους εγγραφές.<\/p>\n<p><b>Παλιές εγγραφές:<\/b> στα Λογισμικά, Διαγωνισμούς και Γενικές Πρόνοιες ιδιοκτήτης ορίζεται ο δημιουργός. Στις Συμβάσεις το κείμενο του Συντονιστή δεν αντιστοιχεί αυτόματα σε χρήστη: στις <b>⚙ Ρυθμίσεις<\/b> υπάρχει κάρτα «Ιδιοκτήτες εγγραφών» που προτείνει αντιστοίχιση όπου βρει μοναδικό χρήστη και δείχνει όσες δεν αντιστοιχίστηκαν. Εγγραφές χωρίς ιδιοκτήτη τις βλέπουν μόνο όσοι έχουν «Βλέπει όλες τις εγγραφές». Οι εκδόσεις HTML και Windows δεν έχουν χρήστες και δεν επηρεάζονται.<\/p>\n\n<h3 id=\"g-bd\">Προϋπολογισμός<\/h3>\n<p>Η καρτέλα δεν έχει δικά της δεδομένα. Συμπληρώνεται αυτόματα από τα επιμέρους ποσά των Λογισμικών, των Συμβάσεων και των <b>ενεργών<\/b> Διαγωνισμών.<\/p>\n<ul>\n<li>Πάνω φαίνεται το σύνολο κάθε έτους, με το έτος τονισμένο.<\/li>\n<li><b>Χρώματα γραμμών:<\/b> κάθε γραμμή χρωματίζεται με ανοιχτή απόχρωση του χρώματος της καρτέλας από την οποία προέρχεται: τιρκουάζ για Λογισμικά, μπλε για Συμβάσεις, μωβ για Διαγωνισμούς. Το υπόμνημα είναι πάνω από τους πίνακες.<\/li>\n<li>Επιπλέον: Με το «Άρθρο» διαλέγεις ένα άρθρο ή όλα. Κάθε άρθρο έχει δικό του πίνακα με στήλες Α/Α, Λεπτομέρειες Δαπάνης (το όνομα της σύμβασης, του διαγωνισμού ή του λογισμικού), Τρόπος Υπολογισμού και ένα ποσό ανά έτος.<\/li>\n<li><b>ΦΠΑ:<\/b> στις εγγραφές τα ποσά είναι χωρίς ΦΠΑ. Ο Προϋπολογισμός προσθέτει ΦΠΑ, προεπιλογή 19% (στήλες «€ με ΦΠΑ»). Ο Τρόπος Υπολογισμού δείχνει καθαρό ποσό + ΦΠΑ = σύνολο.<\/li>\n<li><b>Ανάλυση ανά έτος = ΝΑΙ:<\/b> το ποσό μοιράζεται ανά μήνα στα ημερολογιακά έτη της περιόδου (ένας μερικός μήνας μετράει ανάλογα με τις ημέρες). Παράδειγμα: 1.200 € καθαρά με περίοδο από 1/4 για 12 μήνες γίνονται 1.428 € με ΦΠΑ, δηλαδή 1.071 € στο πρώτο έτος και 357 € στο επόμενο.<\/li>\n<li><b>Ανάλυση ανά έτος = ΌΧΙ:<\/b> ολόκληρο το ποσό μπαίνει στο έτος έναρξης.<\/li>\n<li>Ποσά χωρίς άρθρο εμφανίζονται στον πίνακα «Χωρίς άρθρο». Αν μια εγγραφή δεν έχει ημερομηνία έναρξης, εμφανίζεται προειδοποίηση ότι δεν περιλαμβάνεται.<\/li>\n<li><b>Εξαγωγή Excel:<\/b> δημιουργεί φύλλο σύνοψης και ένα φύλλο ανά άρθρο, με τύπους αθροίσματος.<\/li>\n<li>Εγγραφές στον Κάδο, ακυρωμένοι και προωθημένοι διαγωνισμοί δεν υπολογίζονται.<\/li>\n<\/ul>\n<p><b>Άρθρα προϋπολογισμού:<\/b> δες και την καρτέλα «Άρθρα». Η λίστα (Κωδικός, Περιγραφή, Κατηγορία, Περιγραφή κατηγορίας, Ανάλυση ανά έτος ΝΑΙ/ΌΧΙ) είναι πίνακας με «+ Προσθήκη νέου άρθρου» και «Διαγραφή». Η επεξεργασία γίνεται μέσα στην ίδια την εφαρμογή, από το κουμπί «Επεξεργασία άρθρων» της καρτέλας «Άρθρα» (ή «Άρθρα προϋπολογισμού» στον Προϋπολογισμό), σε όλες τις εκδόσεις. Άρθρο που χρησιμοποιείται σε εγγραφές δεν διαγράφεται και δεν αλλάζει κωδικό.<\/p>\n\n<h3 id=\"g-rc\">Πλαίσιο Συμφιλίωσης<\/h3>\n<p>Η καρτέλα δεν έχει δικά της δεδομένα· υπολογίζεται αυτόματα και δείχνει <b>έναν πίνακα ακριβώς στη μορφή του προτύπου Excel<\/b>: στήλες Κεφάλαιο, Άρθρο, Εγκεκριμένος Π/Υ του τρέχοντος έτους, και για τα τρία επόμενα έτη (Y+1, Y+2, Y+3) «Π/Υ Βάση ΜΔΠ», «Προτεινόμ. Αλλαγή» και «Αναθεωρ. Π/Υ», και τέλος «Επεξηγήσεις για την προτεινόμενη αλλαγή». Οι αριθμοί 1–6 πάνω από τις στήλες δείχνουν ποιες στήλες αθροίζονται στα αναθεωρημένα ποσά (1+2, 3+4, 5+6). Τα έτη προκύπτουν από το τρέχον έτος. Υπάρχει <b>μία γραμμή για κάθε εγγραφή και για κάθε άρθρο<\/b> της (το Κεφάλαιο μένει κενό, στο Άρθρο μπαίνει ο αριθμός του άρθρου). Τα ποσά είναι με ΦΠΑ και κατανεμημένα ανά έτος όπως στον Προϋπολογισμό, και φαίνονται σε ακέραια ευρώ (το ακριβές ποσό φαίνεται όταν πας το ποντίκι πάνω του και στο Excel). Γραμμές υπάρχουν για:<\/p>\n<ul>\n<li><b>Α. Κάθε ενεργό διαγωνισμό<\/b> (όχι τους ακυρωμένους ούτε όσους προωθήθηκαν): τα ποσά του κάθε έτους είναι η «Βάση ΜΔΠ» και η προτεινόμενη αλλαγή είναι 0. Επεξηγήσεις: όνομα διαγωνισμού, περιγραφή, διάρκεια, εκτιμώμενες ημερομηνίες έναρξης και λήξης, εκτιμώμενο κόστος.<\/li>\n<li><b>Β. Κάθε σύμβαση που προήλθε από προώθηση διαγωνισμού<\/b> και το Συνολικό Κόστος της (με πρόσθετες υπηρεσίες, χωρίς ΦΠΑ) διαφέρει από το εκτιμώμενο κόστος του διαγωνισμού <b>πάνω από 4.999 €<\/b> (απόλυτο ποσό, προς τα πάνω ή προς τα κάτω· διαφορά ακριβώς 4.999,00 € δεν αναφέρεται, 4.999,01 € αναφέρεται). Βάση = τα ποσά του διαγωνισμού ανά έτος και άρθρο, Προτεινόμ. Αλλαγή = η διαφορά, Αναθεωρημένο = τα ποσά της σύμβασης. Επεξηγήσεις: σύμβαση, αριθμός διαγωνισμού, περιγραφή, διάρκεια, ημερομηνίες, κόστος.<\/li>\n<li><b>Γ. Κάθε σύμβαση που τροποποιήθηκε<\/b> και άλλαξε το ποσό της: βάση = η σύμβαση όπως ήταν πριν την πρώτη τροποποίηση, αναθεωρημένο = η τρέχουσα.<\/li>\n<li><b>ΣΤ. Κάθε ενεργός διαγωνισμός που τροποποιήθηκε<\/b> και άλλαξε το ποσό του: βάση = ο διαγωνισμός πριν την πρώτη τροποποίηση, αναθεωρημένο = ο τρέχων· στις Επεξηγήσεις αναγράφονται Όνομα, Περιγραφή, Διάρκεια, Εκτιμώμενη έναρξη/λήξη και Εκτιμώμενο κόστος και οι τροποποιήσεις (3.20.0).\n<li><b>Δ. Κάθε σύμβαση με επιλεγμένο το «Συμπερίληψη στο Πλαίσιο Συμφιλίωσης»<\/b> (πεδίο της φόρμας της σύμβασης και της «Τροποποίησης σύμβασης») και <b>Ε. κάθε Γενική Πρόνοια<\/b> με το ίδιο πεδίο. Για τις συμβάσεις τα ποσά είναι η βάση (αλλαγή 0). Επεξήγηση της Γενικής Πρόνοιας: περιγραφή, άρθρο και σημειώσεις.<\/li>\n<\/ul>\n<p>Κάθε ομάδα έχει δικό της χρώμα στο αριστερό άκρο της γραμμής και η πρώτη γραμμή της στήλης «Επεξηγήσεις» γράφει το κριτήριο (Α–Ε). Μια σύμβαση που πληροί περισσότερα από ένα κριτήρια εμφανίζεται σε γραμμές για το καθένα. Ποσά πέρα από το έτος Y+3 δεν εμφανίζονται. Η αναζήτηση φιλτράρει τον πίνακα. Το «Εξαγωγή Excel» δίνει αρχείο με την ίδια μορφοποίηση, πλάτη στηλών και ρυθμίσεις εκτύπωσης με το πρότυπο. Στο WordPress εμφανίζεται σε όποιον βλέπει έστω μία ενότητα.<\/p>\n<h3 id=\"g-ar\">Άρθρα<\/h3>\n<p>Η καρτέλα «Άρθρα» εμφανίζει τα άρθρα προϋπολογισμού του Οργανισμού: Κωδικός, Περιγραφή άρθρου, Κατηγορία, Περιγραφή κατηγορίας, Ανάλυση ανά έτος (ΝΑΙ/ΌΧΙ) και πόσες εγγραφές χρησιμοποιούν κάθε άρθρο. Η αναζήτηση φιλτράρει τη λίστα.<\/p>\n<ul>\n<li>Τη βλέπει όποιος μπορεί να δει τουλάχιστον μία από τις ενότητες (Λογισμικά, Συμβάσεις, Διαγωνισμοί). Δεν έχει δικά της δικαιώματα.<\/li>\n<li><b>Αλλαγή άρθρων:<\/b> από το κουμπί «Επεξεργασία άρθρων» της ίδιας καρτέλας, μέσα στην εφαρμογή. Στο WordPress τα δικαιώματα ορίζονται στο PROCURE360 → Application Management, στην ενότητα «Budget Articles (Άρθρα)»: <b>create<\/b> = προσθήκη νέων άρθρων, <b>edit<\/b> = αλλαγή υπαρχόντων, <b>delete<\/b> = διαγραφή. Δίνονται ανά ρόλο ή ανά χρήστη· από προεπιλογή μόνο ο Administrator τα έχει. Όποιος δεν έχει κανένα βλέπει μόνο τη λίστα, και όποιος έχει μερικά βλέπει τα υπόλοιπα κουμπιά απενεργοποιημένα. Η αποθήκευση γίνεται στον server και ισχύει για όλους.\n<\/ul>\n\n<h3 id=\"g-co\">Ανάδοχοι<\/h3>\n<p><b>Τι είναι:<\/b> η κεντρική λίστα των αναδόχων. Κάθε ανάδοχος καταχωρείται μία φορά και επιλέγεται από τις Συμβάσεις.<\/p>\n<p><b>Πεδία:<\/b> Όνομα (υποχρεωτικό), Διεύθυνση (οδός/αριθμός και συνέχεια), Τ.Κ., Πόλη, Χώρα, Άτομο επικοινωνίας, Τηλέφωνο, Email (για περισσότερα από ένα τηλέφωνο ή email χρησιμοποίησε κόμμα (,) ή ερωτηματικό (;)).<\/p>\n<p><b>Στήλες της λίστας:<\/b> εκτός από τα στοιχεία, η λίστα δείχνει <b>πόσες ενεργές συμβάσεις<\/b> έχει ο ανάδοχος και <b>ποιοι αριθμοί διαγωνισμού<\/b> (π.χ. ΟΑΠ/ΠΜΕ/01/21/01) αφορούν τις ενεργές συμβάσεις του (ο ίδιος αριθμός σε δύο συμβάσεις εμφανίζεται μία φορά). Ενεργή είναι κάθε σύμβαση που δεν έχει λήξει (σε ισχύ, λήγει σύντομα ή δεν έχει ξεκινήσει). Στο παράθυρο του αναδόχου φαίνονται όλες οι συμβάσεις του, με σύνδεσμο για άνοιγμα.<\/p>\n<p><b>Κανόνες:<\/b> δεν επιτρέπονται δύο ανάδοχοι με το ίδιο όνομα (χωρίς διάκριση πεζών/κεφαλαίων και τόνων). Ανάδοχος που χρησιμοποιείται σε σύμβαση δεν διαγράφεται· πρώτα αλλάζεις τον ανάδοχο στις συμβάσεις. Αν μετονομάσεις έναν ανάδοχο, η αλλαγή φαίνεται αυτόματα σε όλες τις συμβάσεις του.<\/p>\n<p><b>Κάδος, Excel:<\/b> η διαγραφή πηγαίνει στον Κάδο (με επαναφορά). Η εξαγωγή Excel/CSV περιλαμβάνει τις ενεργές συμβάσεις και τους αριθμούς διαγωνισμού. Δεν υπάρχει εισαγωγή αναδόχων από Excel· κατά την εισαγωγή συμβάσεων ο ανάδοχος συνδέεται αυτόματα αν το όνομά του υπάρχει στη λίστα.<\/p>\n<p><b>Δικαιώματα (WordPress):<\/b> η ενότητα «Contractors (Ανάδοχοι)» στο Application Management έχει δικά της δικαιώματα προβολής, δημιουργίας, επεξεργασίας, διαγραφής και εξαγωγής.<\/p>\n\n<h3 id=\"g-ms\">Milestones<\/h3>\n<p>Σε μια εγγραφή (Λογισμικό ή Σύμβαση) πρόσθεσε milestones ανά έτος με «+ Προσθήκη milestone»: περιγραφή, ημερομηνία παράδοσης, ειδοποίηση (30 ή 60 ημέρες πριν), σχόλια και συνημμένα. Η ειδοποίηση εμφανίζεται στην οθόνη και στέλνεται με email.<\/p>\n\n<h3 id=\"g-att\">Συνημμένα<\/h3>\n<p>Στο παράθυρο μιας εγγραφής πάτα «+ Προσθήκη αρχείων» (PDF, εικόνες, CSV, κείμενο, Word, Excel, PowerPoint, HTML, XML, email (eml/msg), άδειες (lic), συμπιεσμένα (zip/7z/rar), JSON, RTF, ics/vcf, πιστοποιητικά (cer/crt/p7m/p7s), dwg/dxf κ.ά., <b>έως 20 MB το καθένα<\/b>· δεν υπάρχει όριο στον αριθμό των αρχείων). Για άνοιγμα πάτα στο όνομα του αρχείου. Τα αρχεία <b>HTML<\/b> δεν ανοίγουν μέσα στην εφαρμογή (για λόγους ασφαλείας, γιατί θα μπορούσαν να εκτελέσουν κώδικα): κατεβαίνουν στον υπολογιστή σου και τα ανοίγεις από εκεί. Στο WordPress ελέγχεται και το περιεχόμενο: ένα «.pdf» που δεν είναι PDF, ή ένα πρόγραμμα/script με άλλη επέκταση, απορρίπτεται με σχετικό μήνυμα. Στο WordPress ο server μπορεί να έχει μικρότερο όριο (ρυθμίσεις PHP <code>upload_max_filesize<\/code> και <code>post_max_size<\/code>)· τότε η εφαρμογή δείχνει το πραγματικό όριο δίπλα στο κουμπί και, για μεγαλύτερο αρχείο, ζητά από τον διαχειριστή του hosting να τα αυξήσει σε τουλάχιστον 20M. Το «Αφαίρεση» σβήνει το αρχείο (με αναίρεση για λίγα δευτερόλεπτα). Τα συνημμένα εμφανίζονται ως στήλη «Αρχεία» στη λίστα και ως όνομα στην εξαγωγή.<\/p>\n\n<h3 id=\"g-trash\">Κάδος και αναίρεση<\/h3>\n<ul>\n<li><b>Αναίρεση:<\/b> μετά από διαγραφή εγγραφής, milestone ή συνημμένου εμφανίζεται για 8 δευτερόλεπτα κουμπί «Αναίρεση».<\/li>\n<li><b>Κάδος:<\/b> η διαγραφή μεταφέρει την εγγραφή στον Κάδο (κουμπί «🗑 Κάδος» δίπλα στα φίλτρα). Εκεί γίνεται <b>Επαναφορά<\/b>. Οι εγγραφές του κάδου δεν υπολογίζονται, δεν στέλνουν υπενθυμίσεις και δεν μπαίνουν στις εξαγωγές.<\/li>\n<li><b>Οριστική διαγραφή:<\/b> γίνεται μόνο από τον Κάδο (στο WordPress με ξεχωριστό δικαίωμα) και αυτόματα μετά από 30 ημέρες (ρυθμίζεται στο WordPress: Ρυθμίσεις → PROCURE360 → Παραμονή στον Κάδο· 0 = ποτέ).<\/li>\n<\/ul>\n\n<h3 id=\"g-rem\">Υπενθυμίσεις<\/h3>\n<ul>\n<li>Στο άνοιγμα της εφαρμογής εμφανίζεται παράθυρο «Needs your attention» με ό,τι έληξε ή λήγει σύντομα. Σε κάθε καρτέλα φαίνονται και ειδοποιήσεις για την άλλη καρτέλα.<\/li>\n<li><b>WordPress:<\/b> στέλνονται και email, αυτόματα μία φορά την ημέρα. Παραλήπτες είναι τα email της εγγραφής (ή, αν δεν υπάρχουν, οι γενικοί παραλήπτες των Ρυθμίσεων) και ο ιδιοκτήτης της εγγραφής· το email επαναλαμβάνεται κάθε Ν ημέρες όσο η εγγραφή χρειάζεται ενέργεια. Οι Διαγωνισμοί δεν έχουν υπενθυμίσεις.<\/li>\n<li>Στις εκδόσεις HTML και Windows δεν στέλνονται email, μόνο το παράθυρο στο άνοιγμα. Η έκδοση Windows μπορεί να ανοίγει με την εκκίνηση των Windows.<\/li>\n<\/ul>\n\n<h3 id=\"g-xl\">Excel: εισαγωγή και εξαγωγή<\/h3>\n<ul>\n<li><b>Εισαγωγή:<\/b> κουμπί «Import Excel» (Λογισμικά και Συμβάσεις). Οι στήλες αναγνωρίζονται από τους τίτλους τους, ελληνικούς ή αγγλικούς. Υπάρχει και πρότυπο αρχείου για λήψη. Οι Διαγωνισμοί δεν έχουν εισαγωγή από Excel.<\/li>\n<li><b>Εξαγωγή:<\/b> κουμπί «Export» / «Εξαγωγή» σε Excel ή CSV, με όλα τα πεδία και τα επιμέρους ποσά. Στους Διαγωνισμούς περιλαμβάνεται και η κατάσταση.<\/li>\n<li>Στο WordPress η εξαγωγή χρειάζεται δικαίωμα «export».<\/li>\n<\/ul>\n\n<h3 id=\"g-cfg\">Ρυθμίσεις εφαρμογής (καρτέλα ⚙ Ρυθμίσεις)<\/h3>\n<ul>\n<li><b>Πού είναι:<\/b> η καρτέλα «⚙ Ρυθμίσεις» δίπλα στα Άρθρα. Στο WordPress φαίνεται και αλλάζει μόνο από διαχειριστή (δικαίωμα διαχείρισης)· στις εκδόσεις HTML και Windows είναι ανοιχτή σε όποιον χρησιμοποιεί τον υπολογιστή.<\/li>\n<li><b>Γενικά:<\/b> το ποσοστό ΦΠΑ του Προϋπολογισμού (προεπιλογή 19%, 0–100) και οι προεπιλεγμένες ημέρες υπενθύμισης για τα νέα έτη συμβάσεων (προεπιλογή 30, 1–365). Η αλλαγή του ΦΠΑ επηρεάζει μόνο την εμφάνιση του Προϋπολογισμού, οι εγγραφές κρατούν ποσά χωρίς ΦΠΑ. Οι προεπιλεγμένες ημέρες ισχύουν για νέα έτη συμβάσεων, όχι για τα υπάρχοντα ούτε για τα Λογισμικά.<\/li>\n<li><b>Custom fields (δικά σου πεδία):<\/b> μπορείς να προσθέσεις δικά σου πεδία σε Συμβάσεις, Διαγωνισμούς, Αναδόχους και Λογισμικά (έως 30 ανά καρτέλα). Τύποι: Κείμενο, Αριθμός / Ποσό €, Ημερομηνία, Λίστα επιλογών. Τα πεδία εμφανίζονται στις φόρμες, στις λεπτομέρειες, στις στήλες της λίστας (⚙ Στήλες) και στις εξαγωγές Excel/CSV. Ο τύπος ενός αποθηκευμένου πεδίου δεν αλλάζει. Αν διαγράψεις ένα πεδίο, οι τιμές του κρύβονται και χάνονται όταν ξαναγίνει αποθήκευση της εγγραφής.<\/li>\n<li><b>Πρότυπο Σημειώματος ανανέωσης:<\/b> η κάρτα «Πρότυπο Σημειώματος ανανέωσης» έχει τα κουμπιά <b>Λήψη τρέχοντος προτύπου<\/b>, <b>Ανέβασμα νέου προτύπου (.docx)<\/b> και <b>Επαναφορά στο προεπιλεγμένο<\/b>. Για αλλαγή κειμένου ή μορφοποίησης: κατέβασε το πρότυπο, άλλαξέ το στο Word και ανέβασέ το. Τα πεδία που συμπληρώνονται αυτόματα γράφονται σε αγκύλες και πρέπει να μείνουν όπως είναι: <code>[Σημερινή Ημερομηνία]<\/code>, <code>[Software Name]<\/code>, <code>[Description]<\/code>, <code>[Renewal Date From]<\/code>, <code>[Renewal Date To]<\/code>, <code>[Cost]<\/code>, <code>[Κωδικός Άρθρου]<\/code>, <code>[Περιγραφή Άρθρου]<\/code>. Μετά το ανέβασμα η εφαρμογή λέει ποια πεδία βρέθηκαν. Όριο 2 MB· αρχεία με macros απορρίπτονται. Στο WordPress το πρότυπο αποθηκεύεται στη βάση και το αλλάζει μόνο διαχειριστής (δικαίωμα διαχείρισης ρυθμίσεων)· στο απλό HTML και στα Windows αποθηκεύεται σε αυτόν τον browser/υπολογιστή και <b>δεν<\/b> περιλαμβάνεται στο αντίγραφο ασφαλείας.<\/li>\n<li><b>Αντίγραφο ασφαλείας (Backup):<\/b> το κουμπί «Λήψη αντιγράφου» κατεβάζει ένα αρχείο ZIP με όλα τα δεδομένα (Λογισμικά, Συμβάσεις, Διαγωνισμοί, Ανάδοχοι), τα Άρθρα, τις Ρυθμίσεις και τα συνημμένα. Ο κάδος δεν περιλαμβάνεται. Το αρχείο περιέχει πραγματικά δεδομένα και ονόματα χρηστών· φύλαξέ το με ασφάλεια.<\/li>\n<li><b>Προγραμματισμένο backup (WordPress):<\/b> στην ίδια σελίδα, ο διαχειριστής μπορεί να ενεργοποιήσει αυτόματο backup <b>κάθε εβδομάδα ή κάθε μήνα<\/b> σε φάκελο που ορίζει, π.χ. φάκελο δικτύου (<code>/mnt/backup/procure360<\/code> ή <code>\\\\server\\share\\procure360<\/code>). Ο φάκελος πρέπει να τον βλέπει και να γράφει σε αυτόν ο server του WordPress και να είναι <b>εκτός<\/b> του site. Ορίζεις και πόσα backup κρατούνται (τα παλαιότερα διαγράφονται). Το αρχείο είναι το ίδιο ZIP με το χειροκίνητο και γίνεται Restore με τον ίδιο τρόπο. Το κουμπί «Αποθήκευση και backup τώρα» δοκιμάζει τη διαδρομή. Η εκτέλεση γίνεται από το WP-Cron (όταν το site έχει επισκέψεις), οπότε μπορεί να καθυστερήσει λίγο. Αν αποτύχει, στέλνεται email το πολύ μία φορά την ημέρα. Το πρόγραμμα ΔΕΝ περιλαμβάνεται στο backup, ώστε μια επαναφορά να μην αλλάζει τη διαδρομή.<\/li>\n<li><b>Προγραμματισμένο backup (Windows):<\/b> τρέξε το <code>Schedule-Backup.bat<\/code> (από τον φάκελο που εξήγαγες): ρωτά φάκελο (π.χ. δικτύου), εβδομαδιαίο ή μηνιαίο, ώρα και πόσα να κρατούνται, και φτιάχνει προγραμματισμένη εργασία των Windows. Εκεί το backup είναι zip του φακέλου δεδομένων της εφαρμογής (όπως το Backup.bat), όχι το ZIP της σελίδας Ρυθμίσεων. Τρέχει όσο είσαι συνδεδεμένος στα Windows και ο φάκελος δικτύου είναι προσβάσιμος. Στο απλό αρχείο HTML δεν υπάρχει αυτόματο backup.<\/li>\n<li><b>Επαναφορά (Restore):<\/b> διάλεξε το ZIP, δες την προεπισκόπηση (πόσες εγγραφές θα προστεθούν ή θα ενημερωθούν) και επιβεβαίωσε. Η επαναφορά ενημερώνει ή προσθέτει εγγραφές με βάση το αναγνωριστικό τους και <b>δεν διαγράφει<\/b> τίποτα. Μπορείς να επιλέξεις αν θα επαναφερθούν και οι Ρυθμίσεις και τα Άρθρα. Τα συνημμένα που υπάρχουν ήδη (ίδιο όνομα και μέγεθος) δεν ανεβαίνουν ξανά.<\/li>\n<\/ul>\n\n<h3 id=\"g-set\">Ρυθμίσεις και δικαιώματα (WordPress)<\/h3>\n<ul>\n<li><b>Μενού PROCURE360 (στο WordPress admin):<\/b> όλα βρίσκονται κάτω από ένα μενού. «Ρυθμίσεις»: γενικοί παραλήπτες υπενθυμίσεων, κάθε πόσες ημέρες επαναλαμβάνεται το email, παραμονή στον Κάδο και κουμπί αποστολής υπενθυμίσεων τώρα. Τα άρθρα δεν είναι πια εκεί· επεξεργάζονται μέσα στην εφαρμογή.<\/li>\n<li><b>PROCURE360 → Application Management:<\/b> εκεί ορίζεται ποιος έχει πρόσβαση και με ποιον ρόλο. Κάθε ενότητα (Software, Contracts, Tenders, Contractors, Budget Articles) έχει δικαιώματα προβολής, δημιουργίας, επεξεργασίας, διαγραφής και εξαγωγής. Επιπλέον υπάρχει το «purge» για οριστική διαγραφή από τον Κάδο. Το δικαίωμα προσαρμόζεται και ανά χρήστη. Στα Software, Contracts, Tenders και Γενικές Πρόνοιες υπάρχει και το <b>«view_all»<\/b> (βλέπει όλες τις εγγραφές)· δες «Ιδιοκτήτες και ορατότητα εγγραφών».<\/li>\n<li>Ό,τι γίνεται καταγράφεται στο αρχείο δραστηριότητας του Application Management.<\/li>\n<\/ul>\n\n<h3 id=\"g-data\">Δεδομένα και αντίγραφα ασφαλείας<\/h3>\n<ul>\n<li><b>WordPress:<\/b> τα δεδομένα είναι στη βάση του WordPress και είναι κοινά για όλους τους χρήστες. Τα αντίγραφα γίνονται με το αντίγραφο της βάσης και του φακέλου uploads του site σου. Πριν από αναβάθμιση plugin κάνε αντίγραφο.<\/li>\n<li><b>HTML και Windows:<\/b> τα δεδομένα αποθηκεύονται στον browser του συγκεκριμένου υπολογιστή και δεν μοιράζονται με άλλους. Στα Windows το Backup.bat φτιάχνει zip στα Έγγραφα. Μην καθαρίσεις τα δεδομένα του browser. Εξαγωγή Excel όποτε θες επιπλέον αντίγραφο.<\/li>\n<\/ul>\n\n<h3 id=\"g-sec\">Ασφάλεια και ίχνη ελέγχου (για διαχειριστές WordPress)<\/h3>\n<ul>\n<li><b>Τι καταγράφεται:<\/b> στο αρχείο δραστηριότητας του Application Management φαίνεται πλέον <b>ποιο πεδίο άλλαξε και από τι σε τι<\/b> (π.χ. κόστος 100 → 250). Στα ευαίσθητα πεδία (όνομα χρήστη, email) γράφεται μόνο «changed», όχι η τιμή. Καταγράφονται επίσης οι <b>λήψεις/ανοίγματα συνημμένων<\/b>, τα <b>αρχεία που απορρίφθηκαν<\/b> και οι <b>αιτήσεις που απορρίφθηκαν<\/b> (χωρίς δικαίωμα ή με υπέρβαση ορίου), το πολύ μία φορά το λεπτό για την ίδια ενέργεια.<\/li>\n<li><b>Αλυσίδα που δείχνει αν πείραξε κάποιος το αρχείο:<\/b> προαιρετική. Βάλε στο <code>wp-config.php<\/code> ένα μυστικό κλειδί: <code>define( 'RL_AUDIT_KEY', '… 64 τυχαίοι χαρακτήρες …' );<\/code> και κράτα αντίγραφο σε ασφαλές μέρος εκτός server. Κάθε εγγραφή «δένεται» με την προηγούμενη. Ο έλεγχος γίνεται με <code>wp procure360 audit-verify<\/code>: αναφέρει αν κάποια εγγραφή άλλαξε, διαγράφηκε ή προστέθηκε κρυφά. Χωρίς κλειδί η αλυσίδα δεν γράφεται. Πρόσεξε: αν το Application Management σβήνει παλιές εγγραφές (προεπιλογή 365 ημέρες), ο έλεγχος θα τις δείξει ως «λείπουν»· βάλε διατήρηση 0 ή αρχειοθέτησε.<\/li>\n<li><b>Αντίγραφο σε syslog:<\/b> κάθε εγγραφή στέλνεται και στο syslog του server (facility local6, πρόγραμμα «procure360») για να υπάρχει αντίγραφο εκτός βάσης δεδομένων.<\/li>\n<li><b>Έλεγχος αρχείων:<\/b> το σύστημα ελέγχει πλέον και το <b>περιεχόμενο<\/b> του αρχείου: ένα «.pdf» που δεν είναι PDF, ή εκτελέσιμο/script με άλλη επέκταση, απορρίπτεται. Προαιρετικά μπορεί να γίνεται και έλεγχος με ClamAV (<code>RL_CLAMSCAN_BIN<\/code>) και να αποθηκεύονται τα αρχεία εκτός του web root (<code>RL_FILES_DIR<\/code>). Οι ρυθμίσεις αυτές είναι τεχνικές: δες το αρχείο documentation/08-audit-and-hardening.md.<\/li>\n<li><b>Ποιος αλλάζει τις Ρυθμίσεις:<\/b> στο Application Management υπάρχει η ενότητα «PROCURE360 Settings» με το δικαίωμα «Change settings and schedule backups». Όποιος το έχει (προεπιλογή: Administrator και Super Admin) χρησιμοποιεί την καρτέλα ⚙ Ρυθμίσεις και το προγραμματισμένο backup <b>χωρίς<\/b> να είναι διαχειριστής του WordPress. Οι διαχειριστές του WordPress συνεχίζουν να έχουν πρόσβαση.<\/li>\n<li><b>Excel χωρίς internet:<\/b> η βιβλιοθήκη Excel (SheetJS 0.20.3) περιλαμβάνεται στο πακέτο και φορτώνεται με έλεγχο ακεραιότητας· καμία εξωτερική διεύθυνση δεν χρειάζεται.<\/li>\n<\/ul>\n\n<h3 id=\"g-faq\">Συχνές ερωτήσεις<\/h3>\n<ul>\n<li><b>Γιατί ο Προϋπολογισμός δείχνει μεγαλύτερο ποσό από αυτό που έγραψα;<\/b> Γιατί προσθέτει ΦΠΑ 19%. Οι εγγραφές κρατούν ποσά χωρίς ΦΠΑ.<\/li>\n<li><b>Ο διαγωνισμός δεν φαίνεται στον Προϋπολογισμό.<\/b> Ελέγχεται η κατάστασή του (πρέπει να είναι «Ενεργός») και αν έχει επιμέρους ποσά ή κόστος και ημερομηνία έναρξης.<\/li>\n<li><b>Έσβησα κάτι κατά λάθος.<\/b> Πάτα «Αναίρεση» αμέσως, αλλιώς πήγαινε στον Κάδο και πάτα Επαναφορά.<\/li>\n<li><b>Δεν μπορώ να διαγράψω ένα άρθρο.<\/b> Χρησιμοποιείται σε εγγραφές (live ή στον Κάδο). Άλλαξε πρώτα το άρθρο σε αυτές τις εγγραφές.<\/li>\n<li><b>Δεν βλέπω μια εγγραφή που ξέρω ότι υπάρχει (WordPress).<\/b> Βλέπεις μόνο τις εγγραφές των οποίων είσαι ιδιοκτήτης (Συντονιστής/Υπεύθυνος). Αν χρειάζεσαι πρόσβαση σε όλες, ζήτα το «Βλέπει όλες τις εγγραφές» από τον διαχειριστή.<\/li>\n<li><b>Δεν βλέπω τον Προϋπολογισμό.<\/b> Κρύβεται από όσους δεν έχουν «Βλέπει όλες τις εγγραφές».<\/li>\n<li><b>Δεν βλέπω μια καρτέλα ή ένα κουμπί (WordPress).<\/b> Ο ρόλος σου δεν έχει το σχετικό δικαίωμα· ζήτα το από τον διαχειριστή.<\/li>\n<li><b>Η σελίδα φαίνεται ίδια μετά από αναβάθμιση.<\/b> Κάνε ανανέωση με Ctrl+F5.<\/li>\n<\/ul>\n\n<h3 id=\"g-new\">Τι νέο υπάρχει<\/h3>\n<ul>\n<li><b>3.22.0:<\/b> <b>Συνημμένα ανά περίοδο στα Λογισμικά.<\/b> Στην ανανέωση τα συνημμένα (τιμολόγια, αποδείξεις) μεταφέρονται στην προηγούμενη περίοδο, με λίστα με τικ ώστε να μείνουν στα τρέχοντα όσα συνεχίζουν να ισχύουν. Κάθε προηγούμενη περίοδος έχει δικά της αρχεία, με δυνατότητα προσθήκης και αφαίρεσης. Τα παλιά συνημμένα προηγούμενων ανανεώσεων που υπάρχουν ήδη δεν μετακινούνται αυτόματα.<\/li>\n<li><b>3.21.0:<\/b> <b>Ιδιοκτήτες εγγραφών<\/b> (WordPress): στα Λογισμικά, Συμβάσεις, Διαγωνισμούς και Γενικές Πρόνοιες όποιος δεν έχει το δικαίωμα «Βλέπει όλες τις εγγραφές» βλέπει και αλλάζει μόνο τις δικές του. Στις Συμβάσεις ιδιοκτήτης είναι ο Συντονιστής (λίστα χρηστών WordPress), στις υπόλοιπες ο Υπεύθυνος. Προειδοποίηση όταν ορίζεται άλλος ιδιοκτήτης, οθόνη αντιστοίχισης παλιών εγγραφών στις Ρυθμίσεις, υπενθυμίσεις και στον ιδιοκτήτη. Ο Προϋπολογισμός και το Πλαίσιο Συμφιλίωσης κρύβονται από όσους δεν βλέπουν τα πάντα. Στην αναβάθμιση τίποτα δεν αλλάζει μέχρι ο διαχειριστής να αφαιρέσει το «view_all».<\/li>\n<li><b>3.20.0:<\/b> <b>Τροποποίηση Διαγωνισμού<\/b> για ενεργούς διαγωνισμούς, με την προηγούμενη τιμή κάθε αλλαγμένου πεδίου. Στο Πλαίσιο Συμφιλίωσης νέα ομάδα <b>ΣΤ<\/b> για τροποποιημένους διαγωνισμούς με αλλαγή ποσού. <b>Αυτόματοι διαγωνισμοί<\/b> κάθε 5 Ιανουαρίου από τις συμβάσεις που λήγουν σε +1/+2/+3 έτη (κατάσταση «Σε αναμονή έγκρισης», κόστος = 10% της σύμβασης). Κάθε διαγωνισμός συνδέεται με τη <b>σχετιζόμενη σύμβαση<\/b>. Τα συνημμένα κατεβαίνουν με το όνομα του αρχείου.<\/li>\n<li><b>3.19.0:<\/b> Η καρτέλα «Online Renewals» μετονομάστηκε σε <b>«Λογισμικά»<\/b>. Το <b>Πλαίσιο Συμφιλίωσης<\/b> είναι πλέον ένας πίνακας ακριβώς στη μορφή του προτύπου Excel (Κεφάλαιο, Άρθρο, Εγκεκριμένος Π/Υ, Βάση ΜΔΠ / Προτεινόμ. Αλλαγή / Αναθεωρημένο για τρία έτη, Επεξηγήσεις), με μία γραμμή ανά εγγραφή και άρθρο για ενεργούς διαγωνισμούς, συμβάσεις με μεταβολή &gt; 4.999 €, τροποποιημένες συμβάσεις, επιλεγμένες συμβάσεις και Γενικές Πρόνοιες. Η εξαγωγή Excel κρατά τη μορφή του προτύπου.<\/li>\n<li><b>3.18.0:<\/b> Σε κάθε Online Renewal υπάρχει το κουμπί <b>«Ετοιμασία Σημειώματος»<\/b>: δημιουργεί σημείωμα Word (.docx) από πρότυπο. Το πρότυπο βρίσκεται στις <b>⚙ Ρυθμίσεις<\/b>, όπου μπορείς να το κατεβάσεις, να ανεβάσεις τροποποιημένο ή να επαναφέρεις το προεπιλεγμένο.<\/li>\n<li><b>3.17.0:<\/b> Πλαίσιο Συμφιλίωσης: ο πίνακας Α έχει μόνο τους <b>ενεργούς<\/b> διαγωνισμούς· ο πίνακας Β αναφέρει συμβάσεις που από την προώθηση αυξήθηκαν ή μειώθηκαν <b>πάνω από 4.999 €<\/b> (αντί για απόκλιση 20%). Νέο πεδίο <b>«Συμπερίληψη στο Πλαίσιο Συμφιλίωσης»<\/b> στις Συμβάσεις και στις Γενικές Πρόνοιες, με δύο νέους πίνακες (Δ και Ε) για τις επιλεγμένες εγγραφές.<\/li>\n<li><b>3.16.0:<\/b> Νέα καρτέλα <b>Γενικές Πρόνοιες<\/b> (περιγραφή, σχετικό άρθρο, συνημμένα και ποσά για τα επόμενα 3 έτη· περιλαμβάνονται στον Προϋπολογισμό). Νέα καρτέλα <b>Πλαίσιο Συμφιλίωσης<\/b> (όλοι οι διαγωνισμοί· συμβάσεις με απόκλιση πάνω από 20% από τον διαγωνισμό· τροποποιημένες συμβάσεις με αλλαγή ποσού). Στις Συμβάσεις νέα επιλογή <b>Τροποποίηση σύμβασης<\/b> με προηγούμενη τιμή σε κάθε αλλαγμένο πεδίο, περιγραφή τροποποίησης (π.χ. ΤΕΑΑ, ΚΕΑΑ, Συμπληρωματικός Προϋπολογισμός) και ιστορικό που μόνο προστίθεται. Οι Γενικές Πρόνοιες περιλαμβάνονται στο backup/επαναφορά.<\/li>\n<li><b>3.15.0:<\/b> Στις Συμβάσεις δεν επιτρέπεται δεύτερη σύμβαση με τον ίδιο αριθμό διαγωνισμού: εμφανίζεται μήνυμα (φόρμα, εισαγωγή Excel, προώθηση διαγωνισμού, επαναφορά από κάδο, και στον server του WordPress). Πεδίο αναζήτησης σε κάθε σελίδα: νέο φιλτράρισμα στον Προϋπολογισμό, στις Ρυθμίσεις και στον Οδηγό.<\/li>\n<li><b>3.14.0:<\/b> Ίχνη ελέγχου: καταγράφεται ποιο πεδίο άλλαξε (από τι σε τι), οι λήψεις αρχείων και οι απορριφθείσες αιτήσεις· προαιρετική αλυσίδα που ανιχνεύει πείραγμα στο αρχείο δραστηριότητας (WordPress). Τα συνημμένα ελέγχονται και ως προς το περιεχόμενο (προαιρετικά και με ClamAV, και φύλαξη εκτός web root). Νέο δικαίωμα για τις Ρυθμίσεις χωρίς να χρειάζεται διαχειριστής WordPress. Το Excel δουλεύει χωρίς internet (η βιβλιοθήκη περιλαμβάνεται). Δες «Ασφάλεια και ίχνη ελέγχου».<\/li>\n<li><b>3.13.1:<\/b> Όταν ανοίγεις υπάρχουσα εγγραφή (Λογισμικά, Σύμβαση, Διαγωνισμό, Ανάδοχο) ανοίγει σε πλήρη οθόνη, κεντραρισμένη, και όχι σε πλαϊνό πάνελ. Το «Κλείσιμο» και το Escape επιστρέφουν στη λίστα.<\/li>\n<li><b>3.13.0:<\/b> Ρυθμίσεις: προγραμματισμένο backup, εβδομαδιαίο ή μηνιαίο, σε φάκελο που ορίζεις (π.χ. φάκελο δικτύου) με επιλογή πόσα backup κρατούνται. Στο WordPress ρυθμίζεται από τη σελίδα Ρυθμίσεων και τρέχει στον server· στα Windows με το νέο Schedule-Backup.bat.<\/li>\n<li><b>3.12.0:<\/b> Νέα καρτέλα «⚙ Ρυθμίσεις»: ΦΠΑ και προεπιλεγμένες ημέρες υπενθύμισης, δικά σου πεδία (custom fields: κείμενο, αριθμός, ημερομηνία, λίστα επιλογών) σε Συμβάσεις, Διαγωνισμούς, Αναδόχους και Λογισμικά, και Backup / Restore όλων των δεδομένων, των συνημμένων και των ρυθμίσεων σε ένα αρχείο ZIP.<\/li>\n<li><b>3.11.1:<\/b> Συνημμένα: δέχονται πλέον και άλλους τύπους αρχείων, όπως XML, EML, MSG, LIC, JSON, RTF, 7z/RAR/GZ/TAR, ICS/VCF, πιστοποιητικά (CER/CRT/P7M/P7S), TIFF/BMP, DWG/DXF. Τα αρχεία HTML και XML κατεβαίνουν, δεν ανοίγουν μέσα στην εφαρμογή (ασφάλεια).<\/li>\n<li><b>3.11.0:<\/b> Συμβάσεις: κουμπί «Αρχειοθέτηση» για συμβάσεις που έχουν λήξει (ενεργό μόνο όταν η σύμβαση έχει λήξει)· οι αρχειοθετημένες δεν στέλνουν ειδοποιήσεις/υπενθυμίσεις, μένουν στη λίστα για αναφορά (φίλτρο «Αρχείο») και μπορούν να επανέλθουν.<\/li>\n<li><b>3.10.3:<\/b> Στις λεπτομέρειες της σύμβασης αφαιρέθηκε η ένδειξη «(με υπηρεσίες)» δίπλα στο ΚΟΣΤΟΣ.<\/li>\n<li><b>3.10.2:<\/b> Με κάθε αποθήκευση σύμβασης (και διαγωνισμού) το ΚΟΣΤΟΣ συμπληρώνεται από το άθροισμα ετών· η ετικέτα έγινε «Συνολικό κόστος σύμβασης με Επιπρόσθετες / Προαιρετικές Υπηρεσίες».<\/li>\n<li><b>3.10.1:<\/b> Επιπρόσθετες / Προαιρετικές Υπηρεσίες: αφαιρέθηκε το πεδίο «είδος»· το ποσό των υπηρεσιών προστίθεται <b>μόνο στο συνολικό κόστος<\/b> της σύμβασης και όχι στο κόστος κάθε έτους (στη λίστα, στις υπενθυμίσεις και στο Excel). Ο Προϋπολογισμός δεν αλλάζει.<\/li>\n<li><b>3.10.0:<\/b> Συμβάσεις: νέα ενότητα «Επιπρόσθετες / Προαιρετικές Υπηρεσίες» (είδος, περιγραφή, ετήσιο ποσό, άρθρο)· το ποσό προστίθεται στο κόστος κάθε έτους και στο συνολικό κόστος και περνά στον Προϋπολογισμό στο άρθρο του, κατανεμημένο ανά μήνα σε όλα τα έτη της σύμβασης· αντίστοιχες στήλες στο Excel συμβάσεων.<\/li>\n<li><b>3.9.0:<\/b> νέα καρτέλα «Ανάδοχοι» με λίστα αναδόχων (όνομα, διεύθυνση, άτομο επικοινωνίας, τηλέφωνο, email), πλήθος ενεργών συμβάσεων και αριθμοί διαγωνισμού των ενεργών συμβάσεων ανά ανάδοχο· στις Συμβάσεις ο ανάδοχος επιλέγεται από λίστα (με κουμπί «+ Νέος ανάδοχος») και τα στοιχεία του φαίνονται μόνο για ανάγνωση· νέα πεδία αντιπροσώπου αναδόχου ανά σύμβαση· δημιουργία αναδόχων από παλιές συμβάσεις· νέα ενότητα δικαιωμάτων «Contractors».<\/li>\n<li><b>3.8.0:<\/b> οι φόρμες ανοίγουν σε πλήρη οθόνη και δεν κλείνουν κατά λάθος· στοιχεία αναδόχου (ΑΦΜ, διεύθυνση, άτομο επικοινωνίας, τηλέφωνο, email)· υπόδειξη «κόμμα (,) ή ερωτηματικό (;)» στα πεδία email· μοναδικός αριθμός διαγωνισμού (έλεγχος διπλότυπων)· συνημμένα HTML, εμφανές όριο μεγέθους (20 MB ή το όριο του server) και σαφή μηνύματα όταν ένα αρχείο το ξεπερνά.<\/li>\n<li><b>3.7.0:<\/b> νέα ενότητα «Budget Articles (Άρθρα)» στο Application Management με ξεχωριστά δικαιώματα create / edit / delete για την προσθήκη, αλλαγή και διαγραφή άρθρων (ανά ρόλο ή ανά χρήστη).<\/li>\n<li><b>3.6.0:<\/b> τα άρθρα επεξεργάζονται μέσα στην ίδια την εφαρμογή (όχι από τις Ρυθμίσεις του WordPress)· οι Ρυθμίσεις και το Application Management μπήκαν κάτω από ένα ενιαίο μενού «PROCURE360» στο WordPress admin.<\/li>\n<li><b>3.5.0:<\/b> νέα καρτέλα «Άρθρα», το έτος στα σύνολα του Προϋπολογισμού τονίζεται και οι γραμμές των πινάκων χρωματίζονται ανάλογα με την προέλευση (Λογισμικά, Συμβάσεις, Διαγωνισμοί).<\/li>\n<li><b>3.4.1:<\/b> νέα εμφάνιση των τεσσάρων καρτελών: ανάγλυφα κουμπιά με δικό τους χρώμα η καθεμία (Λογισμικά τιρκουάζ, Συμβάσεις μπλε, Διαγωνισμοί μωβ, Προϋπολογισμός πράσινο).<\/li>\n<li><b>3.4.0:<\/b> λογότυπο PROCURE360 στην κεφαλίδα της εφαρμογής και εικονίδιο στον Windows installer και στην καρτέλα του browser.<\/li>\n<li><b>3.3.0:<\/b> ενσωματωμένος οδηγός χρήσης (κουμπί «? Οδηγός»).<\/li>\n<li><b>3.2.0:<\/b> νέο όνομα PROCURE360.<\/li>\n<li><b>3.1.1:<\/b> ο Προϋπολογισμός περιλαμβάνει ΦΠΑ 19%.<\/li>\n<li><b>3.1.0:<\/b> καρτέλα Διαγωνισμοί, με ακύρωση και Promote σε Σύμβαση.<\/li>\n<li><b>3.0.0:<\/b> Κάδος, οριστική διαγραφή με ξεχωριστό δικαίωμα, αναίρεση, προστασία χρησιμοποιούμενων άρθρων.<\/li>\n<li><b>2.5.0:<\/b> άρθρα προϋπολογισμού σε πίνακα, με προσθήκη και διαγραφή.<\/li>\n<li><b>2.4.0:<\/b> καρτέλα Προϋπολογισμός και εξαγωγή Excel.<\/li>\n<li><b>2.3.0:<\/b> επιμέρους ποσά ανά έτος με άρθρο προϋπολογισμού.<\/li>\n<li><b>2.2.0:<\/b> αφαίρεση κωδικού πρόσβασης, πολλά emails, επιλογή και ταξινόμηση στηλών.<\/li>\n<\/ul>";/*GUIDE-END*/
/* search inside the guide (v3.15.0): a section (heading + what follows it) is shown when it contains the text */
function gFilter(q){
  var g=document.querySelector(".guide");if(!g)return;q=String(q||"").trim().toLowerCase();
  var groups=[],cur={nodes:[],head:""};
  [].forEach.call(g.children,function(n){if(n.id==="gNone")return;if(n.tagName==="H3"){groups.push(cur);cur={nodes:[n],head:n.textContent.toLowerCase()}}else cur.nodes.push(n)});groups.push(cur);
  var shown=0;
  groups.forEach(function(gr){var t=gr.nodes.map(function(n){return n.textContent}).join(" ").toLowerCase(),hit=!q||t.indexOf(q)>=0;
    gr.nodes.forEach(function(n){n.style.display=hit?"":"none"});if(hit&&gr.nodes.length)shown++});
  var toc=g.querySelector(".gtoc");if(toc)toc.style.display=q?"none":"";
  var m=document.getElementById("gNone");
  if(q&&!shown){if(!m){m=document.createElement("p");m.id="gNone";m.className="hint";g.appendChild(m)}m.textContent="Δεν βρέθηκε τίποτα στον οδηγό για «"+q+"»."}else if(m)m.remove();
}

  var e=sec&&document.getElementById("g-"+sec);if(e&&e.scrollIntoView)e.scrollIntoView();
}
function showDigest(){
  if(!$("#overlay").hidden)return;
  var list=[];
  S.items.forEach(function(i){var s=status(i);if(s.k!=="ok")list.push({cat:"sw",id:i.id,k:s.k,t:s.t,d:s.d,name:i.name,sub:fmtDate(i.dateTo)+" · "+dayText(s.d)+" · "+money(i.cost)})});
  S.contracts.forEach(function(c){var s=ctInfo(c);if(s.k!=="ok"&&!s.archived)list.push({cat:"ct",id:c.id,k:s.k,t:s.t,d:s.d,name:c.title,sub:s.sub+" · "+mc(ctTotal(c))})});
  ["sw","ct"].forEach(function(cc){msAll(cc).forEach(function(x){list.push({cat:cc,id:x.it.id,k:x.s.k,t:"Milestone",d:x.s.d,name:x.m.description+" · "+msTitle(cc,x.it),sub:fmtDate(x.m.due)+" · "+(cc==="ct"?dayTextEl(x.s.d):dayText(x.s.d))})})});
  if(!list.length)return;
  list.sort(function(a,b){return a.d-b.d});
  var rows=list.map(function(x){
    return '<li><div style="min-width:0"><b>'+esc(x.name)+'</b> <span class="hint">'+(x.cat==="ct"?"Σύμβαση":"Software")+'</span><br><span class="sub hint">'+esc(x.sub)+'</span></div>'+
      '<div class="actions"><span class="pill '+x.k+'">'+x.t+'</span>'+(x.cat==="sw"?'<button class="btn small primary" type="button" data-act="renewid" data-id="'+esc(x.id)+'">Renew</button>':'')+
      '<button class="btn small" type="button" data-act="openid" data-cat="'+x.cat+'" data-id="'+esc(x.id)+'">'+(x.cat==="ct"?"Άνοιγμα":"Open")+'</button></div></li>';
  }).join("");

function ctlSelect(id,v){

function tnRelated(c){

/* amendment of an ACTIVE tender: the same form as the tender edit, plus a description; every changed / added field shows its previous value */
function tnAmend(id){

/*AT-CALC-START*/
/* Automatic tenders: on / after 5 January every contract that ends in the current year +1, +2 or +3 (and has no related tender yet) gets a tender in status "pending" (Pending Approval) */
var AT_PCT=0.10;
function atDue(today){return String(today)>=String(today).slice(0,4)+"-01-05"}
function atPlan(contracts,tenders,today){
  var Y=Number(String(today).slice(0,4)),out=[],linked={};
  (tenders||[]).forEach(function(t){if(t.contractId)linked[t.contractId]=1});
  (contracts||[]).forEach(function(c){
    if(c.archived||linked[c.id])return;
    var ys=c.years||[],to=c.dateTo||(ys.length?ys[ys.length-1].to:""),m=Math.round(Number(c.months));
    if(!parseIso(to)||!(m>0))return;
    var ty=Number(to.slice(0,4));if(ty<Y+1||ty>Y+3)return;
    var from=addDays(to,1),yy=buildYears(from,m).map(function(y){return {from:y.from,to:y.to,cost:""}}),bud=[];
    (c.budget||[]).forEach(function(p){var yr=+p.year||1;if(yr>=1&&yr<=yy.length)bud.push({year:yr,article:String(p.article||""),amount:r2((Number(p.amount)||0)*AT_PCT)})});
    yy.forEach(function(y,i){
      var cy=ys[i]&&ys[i].cost;if(cy!==""&&cy!=null&&isFinite(Number(cy)))y.cost=r2(Number(cy)*AT_PCT);
      var mine=bud.filter(function(p){return p.year===i+1});if(mine.length)y.cost=r2(mine.reduce(function(s,p){return s+p.amount},0));
    });
    out.push({key:to+"|"+c.id,rec:{title:c.title,tender:"",description:c.description||"",months:m,dateFrom:from,dateTo:yy.length?yy[yy.length-1].to:"",cost:r2(ctTotal(c)*AT_PCT),years:yy,budget:bud,attachments:[],createdAt:Date.now(),sample:false,status:"pending",statusAt:"",promotedTo:"",contractId:c.id,autoCreated:true,autoAt:today,amendments:[]}});
  });
  out.sort(function(a,b){return a.key<b.key?-1:a.key>b.key?1:0});
  return out.map(function(x){return x.rec});
}
/*AT-CALC-END*/
async function autoTnRun(){
  var plan=atPlan(S.contracts,S.tenders,todayIso()),n=0;
  for(var i=0;i<plan.length;i++){if(await save(uid(),plan[i],"tn"))n++}
  return n;
}
/* standalone builds: run once a year when the app is opened on / after 5 January (WordPress does it on the server) */
async function autoTnMaybe(){
  var t=todayIso(),y=t.slice(0,4);
  if(!atDue(t))return;
  try{if(localStorage.getItem("rl.autoTn")===y)return}catch(e){}
  var n=await autoTnRun();
  try{localStorage.setItem("rl.autoTn",y)}catch(e){}
  if(n)toast(n+(n===1?" νέος διαγωνισμός δημιουργήθηκε":" νέοι διαγωνισμοί δημιουργήθηκαν")+" αυτόματα και περιμένουν έγκριση");
}

async function ntInspect(buf){
  var z=await zipRead(buf);
  if(!z["word/document.xml"])throw new Error("Το αρχείο δεν είναι έγκυρο έγγραφο Word (.docx).");
  if(Object.keys(z).some(function(n){return /vbaproject|activex/i.test(n)}))throw new Error("Το πρότυπο περιέχει macros και απορρίφθηκε.");
  var dec=new TextDecoder("utf-8"),txt="";
  ntParts(z).forEach(function(n){dec.decode(z[n]).replace(/<w:p[ >][\s\S]*?<\/w:p>/g,function(p){var t="",m,tre=/<w:t(?:\s[^>]*)?>([\s\S]*?)<\/w:t>/g;while((m=tre.exec(p)))t+=xmlUnesc(m[1]);txt+=t+"\n";return ""})});
  var found=[],re=ntRe(),m;while((m=re.exec(txt)))if(found.indexOf(m[1])<0)found.push(m[1]);
  return found;
}
async function ntGet(){
  if(window.RL_NOTE_TPL){
    var r=await window.RL_NOTE_TPL.get(),t=r&&r.template;
    if(t&&t.custom&&t.data)return {custom:true,name:t.name,at:t.at,bytes:t.bytes,bin:b64ToU8(t.data)};
  }else{
    try{var o=JSON.parse(localStorage.getItem(NT_KEY)||"null");if(o&&o.data)return {custom:true,name:o.name,at:o.at,bytes:o.bytes,bin:b64ToU8(o.data)}}catch(e){}
  }
  return {custom:false,name:"Σημείωμα-προεπιλεγμένο.docx",at:0,bytes:0,bin:b64ToU8(NOTE_TPL_B64)};
}

async function ntUpload(f){
  try{
    if(f.size>NT_MAX){ntMsg("Το αρχείο είναι πολύ μεγάλο (μέγιστο 2 MB).",true);return}
    var buf=await f.arrayBuffer(),found=await ntInspect(buf),u=new Uint8Array(buf),b64=u8ToB64(u);
    if(window.RL_NOTE_TPL){await window.RL_NOTE_TPL.save(f.name,b64)}
    else{try{localStorage.setItem(NT_KEY,JSON.stringify({name:f.name,at:Math.floor(Date.now()/1000),bytes:u.length,data:b64}))}catch(e){ntMsg("Δεν ήταν δυνατή η αποθήκευση του προτύπου σε αυτόν τον browser.",true);return}}
    var miss=NT_PH.filter(function(k){return found.indexOf(k)<0});
    ntMsg("Το πρότυπο αποθηκεύτηκε."+(found.length?" Βρέθηκαν "+found.length+" από τα "+NT_PH.length+" πεδία."+(miss.length?" Δεν υπάρχουν στο πρότυπο: "+miss.map(function(k){return "["+k+"]"}).join(", ")+".":""):" ΠΡΟΣΟΧΗ: δεν βρέθηκε κανένα πεδίο σε αγκύλες· το σημείωμα θα βγαίνει χωρίς συμπληρωμένα στοιχεία."),!found.length);
    ntShowInfo();
  }catch(e){ntMsg(e&&e.status===403?"Μόνο οι διαχειριστές μπορούν να αλλάξουν το πρότυπο.":((e&&e.message)||"Αποτυχία αποθήκευσης του προτύπου."),true)}
}
async function ntReset(){

  try{if(window.RL_NOTE_TPL)await window.RL_NOTE_TPL.reset();else{try{localStorage.removeItem(NT_KEY)}catch(e){}}ntMsg("Επανήλθε το προεπιλεγμένο πρότυπο.");ntShowInfo()}
  catch(e){ntMsg("Αποτυχία επαναφοράς: "+((e&&e.message)||""),true)}
}

async function ntGen(){
  ntCollect();var w=S.nt,d=w.d,e="";
  var cost=Number(d.cost),art=artFind(d.article,articles());
  if(!parseIso(d.date))e="Η ημερομηνία του σημειώματος δεν είναι έγκυρη.";
  else if(!String(d.name).trim())e="Συμπλήρωσε το όνομα του λογισμικού.";
  else if(!parseIso(d.from)||!parseIso(d.to))e="Συμπλήρωσε και τις δύο ημερομηνίες της περιόδου ανανέωσης.";
  else if(d.to<d.from)e="Η λήξη της περιόδου πρέπει να είναι μετά την έναρξη.";
  else if(d.cost===""||!isFinite(cost)||cost<0)e="Συμπλήρωσε το κόστος ως αριθμό (0 ή μεγαλύτερο).";
  else if(!String(d.article||"").trim())e="Επίλεξε το άρθρο προϋπολογισμού.";
  if(e){w.err=e;var x=$("#nterr");if(x)x.textContent=e;return}
  var desc=String(d.desc||"").replace(/\s+/g," ").trim().replace(/[.\s]+$/,"");
  var map={"Σημερινή Ημερομηνία":fmtDate(d.date),"Software Name":String(d.name).trim(),"Description":desc||"………","Renewal Date From":fmtDate(d.from),"Renewal Date To":fmtDate(d.to),"Cost":bdNum(cost),"Κωδικός Άρθρου":art?art.code:String(d.article),"Περιγραφή Άρθρου":art?art.desc:""};
  try{
    var t=await ntGet(),out=await ntBuild(t.bin,map);
    var fn=("Σημείωμα ανανέωσης - "+String(d.name).trim()).replace(/[\\\/:*?"<>|\r\n]+/g," ").replace(/\s+/g," ").trim().slice(0,120)+".docx";
    await offer(fn,out);
  }catch(x){w.err="Δεν ήταν δυνατή η δημιουργία του σημειώματος: "+((x&&x.message)||"");var y=$("#nterr");if(y)y.textContent=w.err}
}

/* A general provision reserves money for budget purposes: description, related budget article, attachments and amounts (net of VAT) for the 3 years after the registration year. The amounts are counted in the Budget. */
function pvYears(p){var b=+p.baseYear||new Date().getFullYear();return [b+1,b+2,b+3]}
function pvAmt(p,y){var a=(p.amounts||[]).filter(function(x){return +x.year===y})[0];return a&&a.amount!==""&&a.amount!=null&&isFinite(Number(a.amount))?Number(a.amount):""}
function pvSum(p){return r2(pvYears(p).reduce(function(s,y){return s+(Number(pvAmt(p,y))||0)},0))}
function pvArtText(p){var a=artFind(p.article,articles());return a?a.code+" — "+a.desc:String(p.article||"")}
function pvAllYears(list){var m={};list.forEach(function(p){pvYears(p).forEach(function(y){m[y]=1})});return Object.keys(m).map(Number).sort(function(a,b){return a-b})}
function pvFiltered(){
  var q=String(S.q||"").trim().toLowerCase();
  return (S.provisions||[]).filter(function(p){return !q||[p.title,pvArtText(p),p.notes,p.baseYear].join(" ").toLowerCase().indexOf(q)>=0})
    .sort(function(a,b){return (+b.baseYear||0)-(+a.baseYear||0)||String(a.title).localeCompare(String(b.title),"el")});
}

async function pvSave(){

var RC_LIMIT=4999; /* a contract is reported when its total cost differs from the estimated cost of its tender by MORE than 4,999 € (up or down) */
function rcPct(base,cur){return base>0?Math.round((cur-base)/base*10000)/100:null}
function rcSets(tenders,contracts,limit,provs){
  limit=limit==null?RC_LIMIT:limit;
  var byProm={};(tenders||[]).forEach(function(t){if(t.promotedTo)byProm[t.promotedTo]=t});
  var dev=[],amd=[],inc=[],tamd=[];
  /* ΣΤ: ACTIVE tenders that were amended and whose amount changed (base = the tender before its first amendment) */
  (tenders||[]).forEach(function(t){
    if((t.status||"active")!=="active")return;
    var am=(t.amendments||[]).filter(function(a){return a&&Math.abs((Number(a.costAfter)||0)-(Number(a.costBefore)||0))>=0.005});
    if(am.length){var o=Number(t.amendments[0].costBefore)||0,cu=Number(t.cost)||0;tamd.push({t:t,base:o,cur:cu,diff:r2(cu-o),pct:rcPct(o,cu),n:t.amendments.length,list:t.amendments})}
  });
  (contracts||[]).forEach(function(c){
    var t=byProm[c.id],cur=ctTotal(c);
    if(t){var tc=Number(t.cost)||0,df=r2(cur-tc);if(Math.abs(df)>limit)dev.push({c:c,t:t,base:tc,cur:cur,diff:df,pct:rcPct(tc,cur)})}
    var am=(c.amendments||[]).filter(function(a){return a&&Math.abs((Number(a.costAfter)||0)-(Number(a.costBefore)||0))>=0.005});
    if(am.length){var orig=Number(c.amendments[0].costBefore)||0;amd.push({c:c,base:orig,cur:cur,diff:r2(cur-orig),pct:rcPct(orig,cur),n:c.amendments.length,list:c.amendments})}
    if(c.rcInclude)inc.push({c:c,cur:cur,n:(c.amendments||[]).length});
  });
  /* only ACTIVE tenders are listed (promoted tenders are found through byProm above, they are not listed) */
  return {tenders:(tenders||[]).filter(function(t){return (t.status||"active")==="active"}),dev:dev,amd:amd,inc:inc,tamd:tamd,provs:(provs||[]).filter(function(p){return p&&p.rcInclude})};
}
/*RC-CALC-END*/
/*RC2-CALC-START*/
/* Πλαίσιο Συμφιλίωσης (3.19.0): ONE table in the layout of the Word/Excel template. One row per record AND article:
   A) every active tender, B) contracts promoted from a tender whose total cost differs by more than RC_LIMIT, C) amended contracts whose amount changed,
   D) contracts with "Συμπερίληψη στο Πλαίσιο Συμφιλίωσης", E) general provisions with the same choice.
   Columns: current year Y (approved) · Y+1, Y+2, Y+3: base (ΜΔΠ), proposed change, revised. Amounts include VAT, as in the budget sheet. */
var RC_ORDER=["tn","dv","am","inc","pv","tm"],RC_LBL={tm:"ΣΤ · Τροποποιημένος διαγωνισμός",tn:"Α · Ενεργός διαγωνισμός",dv:"Β · Σύμβαση από διαγωνισμό με μεταβολή κόστους",am:"Γ · Τροποποιημένη σύμβαση",inc:"Δ · Σύμβαση επιλεγμένη για το Πλαίσιο",pv:"Ε · Γενική Πρόνοια"};
function rcByCode(B){var m={};Object.keys(B.byArt).forEach(function(c){var by={};B.byArt[c].forEach(function(r){Object.keys(r.by).forEach(function(y){by[y]=r2((by[y]||0)+r.by[y])})});m[c]=by});return m}
function rcX(l,v){return l+": "+(v===""||v==null?"—":v)}
function rcMonths(m){return m===""||m==null?"":m+" μήνες"}
function rcExplTn(t,kind){return [RC_LBL[kind||"tn"],rcX("Διαγωνισμός",t.title),rcX("Περιγραφή",t.description),rcX("Διάρκεια",rcMonths(t.months)),rcX("Εκτιμώμενη ημερ. έναρξης",bdGr(t.dateFrom)),rcX("Εκτιμώμενη ημερ. λήξης",bdGr(t.dateTo)),rcX("Εκτιμώμενο κόστος",bdEur(Number(t.cost)||0))]}
function rcExplCt(c,kind,extra){
  var l=[RC_LBL[kind],rcX("Σύμβαση",c.title),rcX("Αριθμός Διαγωνισμού",c.tender),rcX("Περιγραφή",c.description),rcX("Διάρκεια",rcMonths(c.months)),rcX("Ημερ. έναρξης",bdGr(c.dateFrom)),rcX("Ημερ. λήξης",bdGr(c.dateTo)),rcX("Κόστος (συνολικό, με πρόσθετες υπηρεσίες, χωρίς ΦΠΑ)",bdEur(ctTotal(c)))];
  return l.concat(extra||[]);
}
function rcExplPv(p){return [RC_LBL.pv,rcX("Περιγραφή",p.title),rcX("Άρθρο",pvArtText(p)),rcX("Σημειώσεις",p.notes)]}
/* base / rev: {code:{year:amount}}. One row per article; rows with no amount in Y..Y+3 are left out */
function rcRows(kind,key,title,base,rev,Y,expl){
  var codes=Object.keys(base).concat(Object.keys(rev).filter(function(c){return !(c in base)})),out=[];
  codes.forEach(function(c){
    var b=base[c]||{},v=rev[c]||{},C=r2(b[Y]||0),D=[],E=[],F=[];
    for(var k=1;k<=3;k++){var d=r2(b[Y+k]||0),f=r2(v[Y+k]||0);D.push(d);F.push(f);E.push(r2(f-d))}
    if(Math.abs(C)<0.005&&D.concat(F).every(function(x){return Math.abs(x)<0.005}))return;
    out.push({kind:kind,key:key,title:title||"",code:c,C:C,D:D,E:E,F:F,expl:expl});
  });
  return out;
}
function rcBuild(arts,tenders,contracts,provs,Y,limit,vat){
  var R=rcSets(tenders,contracts,limit,provs),rows=[];
  function ct(c){return rcByCode(bdBuild(arts,[],[c],[],vat))}
  function tn(t){return rcByCode(bdBuild(arts,[],[],[t],vat))}
  R.tenders.forEach(function(t){var m=tn(t);rows=rows.concat(rcRows("tn",t.id,t.title,m,m,Y,rcExplTn(t)))});
  R.dev.forEach(function(d){
    var ex=["Εκτιμώμενο κόστος διαγωνισμού: "+bdEur(d.base)+" · μεταβολή: "+(d.diff>0?"+":"")+bdEur(d.diff)+(d.pct==null?"":" ("+(d.pct>0?"+":"")+String(d.pct).replace(".",",")+"%)")];
    rows=rows.concat(rcRows("dv",d.c.id,d.c.title,tn(d.t),ct(d.c),Y,rcExplCt(d.c,"dv",ex)));
  });
  R.amd.forEach(function(d){
    var first=d.c.amendments[0]||{},before=Object.assign({},d.c,first.before||{}),
        ex=["Τροποποιήσεις: "+d.n+(d.list.length?" ("+d.list.map(function(a){return a.description||"—"}).join("; ")+")":"")+" · αρχικό κόστος: "+bdEur(d.base)+" · μεταβολή: "+(d.diff>0?"+":"")+bdEur(d.diff)];
    rows=rows.concat(rcRows("am",d.c.id,d.c.title,ct(before),ct(d.c),Y,rcExplCt(d.c,"am",ex)));
  });
  R.inc.forEach(function(d){var m=ct(d.c);rows=rows.concat(rcRows("inc",d.c.id,d.c.title,m,m,Y,rcExplCt(d.c,"inc",[])))});
  R.tamd.forEach(function(d){
    var first=d.t.amendments[0]||{},before=Object.assign({},d.t,first.before||{}),
        ex=["Τροποποιήσεις: "+d.n+(d.list.length?" ("+d.list.map(function(a){return a.description||"—"}).join("; ")+")":"")+" · αρχικό εκτιμώμενο κόστος: "+bdEur(d.base)+" · μεταβολή: "+(d.diff>0?"+":"")+bdEur(d.diff)];
    rows=rows.concat(rcRows("tm",d.t.id,d.t.title,tn(before),tn(d.t),Y,rcExplTn(d.t,"tm").concat(ex)));
  });
  R.provs.forEach(function(p){var m=rcByCode(bdBuild(arts,[],[],[],vat,[p]));rows=rows.concat(rcRows("pv",p.id,p.title,m,m,Y,rcExplPv(p)))});
  rows.forEach(function(r,i){r.i=i});
  rows.sort(function(a,b){
    var k=RC_ORDER.indexOf(a.kind)-RC_ORDER.indexOf(b.kind);if(k)return k;
    k=a.title.localeCompare(b.title,"el");if(k)return k;
    if(a.code!==b.code){if(!a.code)return 1;if(!b.code)return -1;k=a.code.localeCompare(b.code,"el",{numeric:true});if(k)return k}
    return a.i-b.i;
  });
  return {rows:rows,counts:{tn:R.tenders.length,dv:R.dev.length,am:R.amd.length,inc:R.inc.length,pv:R.provs.length,tm:R.tamd.length}};
}

function rcModel(){
  var Y=new Date().getFullYear(),B=rcBuild(articles(),S.tenders,S.contracts,S.provisions,Y,null,null),q=String(S.q||"").trim().toLowerCase();
  var all=B.rows.length,rows=q?B.rows.filter(function(r){return (r.code+" "+r.title+" "+r.expl.join(" ")).toLowerCase().indexOf(q)>=0}):B.rows;

}
function renderRc(){
  var M=rcModel(),c=M.counts,tl=["Ενεργοί διαγωνισμοί","Συμβάσεις με μεταβολή >"+bdNum(RC_LIMIT)+" €","Τροποποιημένες συμβάσεις με αλλαγή ποσού","Συμβάσεις που επιλέχθηκαν","Γενικές Πρόνοιες που επιλέχθηκαν","Τροποποιημένοι διαγωνισμοί με αλλαγή ποσού"];
  $("#stats").innerHTML=RC_ORDER.map(function(k,i){return '<div class="stat"><b>'+c[k]+'</b><span>'+esc(tl[i])+'</span></div>'}).join("");
  $("#alerts").innerHTML="";$("#chips").innerHTML="";
  var css='<style>#rl-app .tbl .rct{border-collapse:collapse;font-size:13px;min-width:1500px;width:100%}#rl-app .tbl .rct th,.rct td{border:1px solid var(--line);padding:5px 7px;text-align:center;vertical-align:middle}#rl-app .tbl .rct th{background:var(--surface2);color:var(--text);font-size:12px;white-space:pre-line;vertical-align:middle}#rl-app .tbl .rct tr.nr th{font-weight:700;background:transparent;padding:2px}#rl-app .tbl .rct td.num{text-align:right;white-space:nowrap}#rl-app .tbl .rct td.ex{text-align:left;white-space:pre-line;min-width:300px;font-size:12px}#rl-app .tbl .rct td.cd{white-space:nowrap}#rl-app .tbl .rct tr.k-tn td:first-child{box-shadow:inset 4px 0 0 #0f8a8a}#rl-app .tbl .rct tr.k-dv td:first-child{box-shadow:inset 4px 0 0 #c2410c}#rl-app .tbl .rct tr.k-am td:first-child{box-shadow:inset 4px 0 0 #7c3aed}#rl-app .tbl .rct tr.k-inc td:first-child{box-shadow:inset 4px 0 0 #2563eb}#rl-app .tbl .rct tr.k-pv td:first-child{box-shadow:inset 4px 0 0 #b45309}#rl-app .tbl .rct tr.k-tm td:first-child{box-shadow:inset 4px 0 0 #0891b2}#rl-app .tbl .rct .chg{font-weight:600}</style>';
  var h=M.heads,th='<tr class="nr"><th></th><th></th><th></th><th>1</th><th>2</th><th></th><th>3</th><th>4</th><th></th><th>5</th><th>6</th><th></th><th></th></tr><tr>'+h.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+'</tr>';
  var body=M.rows.map(function(r){
    var cs=rcCells(r);
    return '<tr class="k-'+r.kind+'">'+cs.map(function(v,i){
      if(i===0)return '<td></td>';
      if(i===1)return '<td class="cd">'+(v?esc(v):'<span class="hint">—</span>')+'</td>';
      if(i===12)return '<td class="ex">'+esc(v)+'</td>';
      return '<td class="num'+((i===4||i===7||i===10)&&v?' chg':'')+'" title="'+esc(bdEur(v))+'">'+rcN(v)+'</td>';
    }).join("")+'</tr>';
  }).join("");

  var info='<p class="hint">Ποσά σε € με ΦΠΑ '+(Math.round(bdVat()*10000)/100).toString().replace(".",",")+'% (όπως στον Προϋπολογισμό), σε ακέραια ευρώ· το ακριβές ποσό φαίνεται στο tooltip και στο Excel. Στις γραμμές Α, Δ και Ε το ποσό του έτους είναι η βάση και η προτεινόμενη αλλαγή είναι 0· στις Β και Γ η βάση είναι το εκτιμώμενο κόστος του διαγωνισμού ή το κόστος πριν την πρώτη τροποποίηση και η αλλαγή η διαφορά. Μια σύμβαση που ανήκει σε περισσότερα από ένα κριτήρια εμφανίζεται σε μία ομάδα γραμμών για το καθένα.</p>';
  var tbl=M.rows.length?'<div class="tbl" style="overflow:auto"><table class="rct"><thead>'+th+'</thead><tbody>'+body+'</tbody></table></div>':'<div class="empty"><h2>'+(String(S.q||"").trim()&&M.all?'Καμία γραμμή δεν ταιριάζει':'Δεν υπάρχουν γραμμές')+'</h2><p>'+(String(S.q||"").trim()&&M.all?'Δεν βρέθηκε τίποτα για «'+esc(S.q)+'».':'Ο πίνακας συμπληρώνεται από τους ενεργούς διαγωνισμούς, τις συμβάσεις και τις γενικές πρόνοιες που πληρούν τα κριτήρια.')+'</p></div>';
  $("#list").innerHTML=css+leg+info+tbl;
}

var ALIAS={name:["software name","name","software","ονομασία λογισμικού"],description:["description","περιγραφή"],vendor:["vendor","supplier","προμηθευτής"],
 website:["website","web site","url","site","ιστοσελίδα"],username:["username","user name","user","login"],emails:["notification emails","notification email","emails","email","e-mail","email ειδοποιήσεων"],
 dateFrom:["date from","from","start","start date"],dateTo:["date to","to","end","end date","expiry","expiry date","expires"],
 cost:["cost excl. vat (€)","cost excl. vat","cost without vat","cost","price","amount"],remindDays:["reminder","reminder days","remind days","alert days"]};
function hk(s){return String(s||"").trim().toLowerCase().replace(/\s+/g," ")}
function toIsoDate(v){
  if(v==null||v==="")return "";
  if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getTime()+12*36e5));
  if(typeof v==="number"){var d=new Date(Math.round((v-25569)*864e5));return iso(new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()))}
  var s=String(v).trim(),m;
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s)))return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);
  if((m=/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/.exec(s))){var y=+m[3];if(y<100)y+=2000;return y+"-"+pad(+m[2])+"-"+pad(+m[1])}
  return "";
}
function parseSheet(buf){
  var wb=XLSX.read(buf,{type:"array",cellDates:true});
  var ws=wb.Sheets[wb.SheetNames[0]];
  var rows=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true});
  return rows.map(function(r,idx){
    var map={};Object.keys(r).forEach(function(k){map[hk(k)]=r[k]});
    var o={};
    Object.keys(ALIAS).forEach(function(key){for(var i=0;i<ALIAS[key].length;i++){var a=ALIAS[key][i];if(map[a]!==undefined&&map[a]!==""){o[key]=map[a];break}}});
    var rec=norm({name:o.name,description:o.description,vendor:o.vendor,website:o.website,username:o.username,emails:o.emails==null?"":String(o.emails),
      dateFrom:toIsoDate(o.dateFrom),dateTo:toIsoDate(o.dateTo),cost:o.cost==null?"":Number(String(o.cost).replace(/[€\s,]/g,function(c){return c===","?".":""})),remindDays:o.remindDays});
    var errs=[];
    if(!rec.name)errs.push("name missing");
    if(!rec.dateTo)errs.push("Date To missing/invalid");
    if(rec.dateFrom&&rec.dateTo&&rec.dateTo<rec.dateFrom)errs.push("Date To before Date From");
    if(!isFinite(rec.cost))errs.push("cost invalid");
    if(emailsErr(rec.emails))errs.push(emailsErr(rec.emails));
    return {n:idx+2,rec:rec,errs:errs};
  });
}

    case "artdel":{if(!artCan("delete"))break;var tr=b.closest("tr"),cd=tr&&tr.querySelector("[data-k=code]"),us=cd&&cd.defaultValue?artUsage(cd.defaultValue):0;
      if(us){toast(S.cat!=="sw"?"Το άρθρο χρησιμοποιείται σε "+us+" εγγραφές και δεν μπορεί να διαγραφεί":"This article is used by "+us+" record(s) and cannot be deleted");break}

    case "exadd":ctCollect();S.cw.d.extras=S.cw.d.extras||[];S.cw.d.extras.push({id:uid(),kind:"extra",desc:"",amount:"",article:""});{var cx=$("#cExtras");if(cx)cx.innerHTML=exBlock(S.cw.d)}break;

ROOT.addEventListener("keydown",function(ev){
  if(ev.key==="Enter"&&S.cw&&!S.co&&S.cw.mode==="step"&&ev.target.tagName==="INPUT"){ev.preventDefault();S.cw.i===cwBase().length?ctSave():ctNext()}
  if(ev.key==="Enter"&&S.wiz&&S.wiz.mode==="step"&&ev.target.tagName==="INPUT"){ev.preventDefault();var l=S.wiz.i===swF().length;l?wizSave():wizNext()}
});
ROOT.addEventListener("input",function(ev){var t=ev.target;if(t&&t.closest&&t.closest("#overlay")&&formOpen())S.dirty=true;if(t&&t.id&&t.id.indexOf("bp_amt_")===0)bpLive();else if(t&&t.id&&t.id.indexOf("ex_amt_")===0)exTotals();if(S.cw&&S.cw.am)amLive()});
ROOT.addEventListener("change",async function(ev){
  var t=ev.target;if(t&&t.closest&&t.closest("#overlay")&&formOpen())S.dirty=true;
  if(S.cw&&S.cw.am&&t.closest&&t.closest("#overlay"))setTimeout(amLive,0);
  if(t.id==="bdArt"){S.bdArt=t.value;try{localStorage.setItem("rl.bdart",t.value)}catch(e){}render();return}
  if(t.dataset&&t.dataset.col){toggleCol(t.dataset.col,t.checked);return}
  if(t.id&&t.id.indexOf("bp_amt_")===0){bpLive();return}
  if(t.id==="remSel"){var it=byId(S.open);if(it){var rec=norm(it);rec.remindDays=+t.value;rec.attachments=it.attachments;rec.history=it.history;rec.createdAt=it.createdAt;rec.sample=it.sample;if(await save(it.id,rec))toast("Reminder set to "+t.value+" days before expiry")}}
  if(t.id==="fileXlsx"&&t.files[0]){
    var f=t.files[0];t.value="";
    try{if(needX())return;var buf=await f.arrayBuffer();var ct=S.cat==="ct";var rows=ct?parseCtSheet(buf):parseSheet(buf);if(!rows.length){toast(ct?"Δεν βρέθηκαν γραμμές στο πρώτο φύλλο":"No rows found in the first sheet");return}ct?showCtImport(rows):showImport(rows)}
    catch(e){toast("Could not read that file")}
  }
  if(S.cw&&!S.co&&t.id==="c_contractorId"){ctCollect();var ci=$("#cCtrInfo");if(ci)ci.innerHTML=ctrInfoHtml(S.cw.d)}
  if(S.cw&&(t.id==="c_months"||t.id==="c_dateFrom")){ctCollect();ctRegen();ctRefresh()}
  if(S.cw&&t.id==="c_dateTo"){ctCollect();ctApplyEnd();ctRefresh(true)}
  if(S.cw&&t.id&&t.id.indexOf("cy_cost_")===0){ctCollect();var sp=$("#cSum");if(sp)sp.textContent=mc(ctSum(S.cw.d.years))}
  if(t.classList&&t.classList.contains("yrRem")){var cc=getItem("ct",S.open);if(cc){var rc=strip(cc);rc.years=cc.years.map(function(y,i){return i===+t.dataset.i?Object.assign({},y,{remind:+t.value}):y});if(await save(cc.id,rc,"ct"))toast("Η υπενθύμιση ενημερώθηκε")}}
  if(t.id==="fileAttach"&&t.files.length){var fl=Array.prototype.slice.call(t.files);t.value="";attachFiles(fl)}
});

/* ---------- start ---------- */
async function start(){
  try{var rc=localStorage.getItem("rl.cat");if(rc==="ct"||rc==="bd"||rc==="tn"||rc==="ar"||rc==="co"||rc==="st"||rc==="pv"||rc==="rc")S.cat=rc}catch(e){}
  render();
  var c=window.claude;if(!c||!c.use)return;
  try{S.assets=await c.use("assets")}catch(e){}
  try{S.dl=await c.use("downloads")}catch(e){}
  try{
    var u=await c.use("user"),db=await c.use("db");
    var id=u&&u.id?await u.id():null;
    if(db&&id){
      S.db=db;S.uid=id;
      S.loaded={};
      var sub=function(name,cat,key){return col(name).onSnapshot(function(snap){var all=snap.docs.map(function(d){return Object.assign({id:d.id},d.data())});S[key]=all.filter(function(x){return !x.deletedAt});if(!window.RL_TRASH)S.trash[cat]=all.filter(function(x){return x.deletedAt}).map(function(x){return Object.assign({},x,{_at:x.deletedAt})});S.loaded[cat]=true;if(key==="items")purgePasswords();if(S.loaded.sw&&S.loaded.ct&&S.loaded.tn&&S.loaded.co&&!S.tinit){S.tinit=1;if(!window.RL_CFG)autoTnMaybe();if(window.RL_TRASH){loadTrash("sw");loadTrash("ct");loadTrash("tn");loadTrash("co");loadTrash("pv")}else autoPurge()}render();maybeDigest()},function(){toast("Live sync stopped — reload the page")})};
      S.unsub=[sub("software","sw","items"),sub("contracts","ct","contracts"),sub("tenders","tn","tenders"),sub("contractors","co","contractors"),sub("provisions","pv","provisions")];
    }
  }catch(e){}
  render();
}
start();
})();
